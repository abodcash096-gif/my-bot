<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Golden Tree - Professional Edition 2026</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-glow: rgba(0, 243, 255, 0.85);
            --gold: #ffdf00;
            --gold-glow: rgba(255, 223, 0, 0.9);
            --bg-dark: #000206;
            --card-bg: rgba(2, 12, 25, 0.99);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at center, #041830 0%, var(--bg-dark) 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background: rgba(1, 5, 12, 0.99);
            border-bottom: 1.5px solid rgba(0, 243, 255, 0.4);
            backdrop-filter: blur(15px);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), #ff8800);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #000;
            box-shadow: 0 0 18px var(--gold-glow);
        }

        .logo {
            text-align: center;
            font-size: 19px;
            font-weight: 900;
            background: linear-gradient(180deg, #fff 0%, var(--gold) 50%, #b38f00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 18px rgba(255, 223, 0, 0.6);
            line-height: 1.1;
        }

        .balance-badge {
            background: rgba(0, 243, 255, 0.12);
            border: 1.5px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 15px var(--neon-glow);
        }

        /* Top Widgets */
        .top-widgets {
            display: flex;
            justify-content: space-between;
            padding: 4px 14px;
        }

        .mini-badge {
            border: 1px solid var(--neon-blue);
            border-radius: 12px;
            padding: 4px 10px;
            font-size: 10px;
            background: rgba(0,30,60,0.85);
            color: var(--neon-blue);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .mini-badge:active { transform: scale(0.95); }

        /* Game Slots Grid Frame */
        .game-container {
            position: relative;
            width: 95%;
            max-width: 420px;
            margin: 4px auto 0;
        }

        .slots-frame {
            display: flex;
            gap: 4px;
            background: rgba(1, 5, 12, 0.99);
            border: 3px solid var(--neon-blue);
            box-shadow: 0 0 45px var(--neon-glow), inset 0 0 25px var(--neon-glow);
            border-radius: 18px;
            padding: 6px;
            position: relative;
            overflow: hidden;
        }

        .reel {
            flex: 1;
            height: 240px;
            background: var(--card-bg);
            border: 1px solid rgba(0, 243, 255, 0.4);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .reel-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
        }

        /* تصميم احترافي للرموز مع تأثيرات ثلاثية الأبعاد */
        .symbol {
            height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            position: relative;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
        }

        .symbol:hover {
            transform: scale(1.15);
        }

        /* الجرة الذهبية النادرة (تظهر وفق خوارزمية عالية الاحترافية) */
        .symbol.jar-rare {
            background: radial-gradient(circle, rgba(255,223,0,0.85) 0%, rgba(255,136,0,0.55) 75%);
            border: 2px solid var(--gold);
            box-shadow: inset 0 0 35px var(--gold), 0 0 35px var(--gold);
            border-radius: 12px;
            animation: rareJarAnim 0.5s infinite alternate;
        }

        @keyframes rareJarAnim {
            0% { transform: scale(1); filter: drop-shadow(0 0 12px var(--gold)); }
            100% { transform: scale(1.18); filter: drop-shadow(0 0 40px var(--gold)); }
        }

        .symbol.seven {
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff, 0 0 40px #0088ff, 0 0 65px #0044ff;
            font-weight: 900;
            font-style: italic;
            animation: sevenGlowAnim 0.7s infinite alternate;
        }

        @keyframes sevenGlowAnim {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.1); filter: brightness(1.5); }
        }

        #lineCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 15;
        }

        /* Win Info Banner */
        .info-panel {
            text-align: center;
            margin: 4px 0;
        }

        .line-info {
            color: var(--neon-blue);
            font-size: 13px;
            font-weight: 700;
            text-shadow: 0 0 12px var(--neon-blue);
        }

        .win-display {
            font-size: 23px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 18px var(--neon-blue);
        }

        /* Bet Selection Chips */
        .bets-container {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 6px;
            padding: 0 10px;
        }

        .bet-chip {
            padding: 6px 12px;
            border-radius: 16px;
            border: 1.5px solid var(--neon-blue);
            background: rgba(0, 30, 60, 0.9);
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-glow);
            transition: all 0.2s;
        }

        .bet-chip.active {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 25px var(--neon-blue);
            font-weight: 900;
            transform: scale(1.08);
        }

        /* Controls Bar */
        .controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 14px;
            margin-bottom: 6px;
        }

        .spin-btn {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            border: 3.5px solid var(--neon-blue);
            background: radial-gradient(circle, rgba(0,243,255,0.9) 0%, rgba(1,5,12,0.99) 100%);
            box-shadow: 0 0 40px var(--neon-blue), inset 0 0 22px var(--neon-blue);
            color: #fff;
            font-size: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .spin-btn:active { transform: scale(0.9); }

        .sub-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1.5px solid var(--neon-blue);
            background: rgba(1, 5, 12, 0.92);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-glow);
            transition: 0.2s;
        }
        .sub-btn.active-sub {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
            box-shadow: 0 0 20px var(--gold);
        }

        /* Bottom Stats */
        .history-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(1, 5, 12, 0.99);
            border-top: 1.5px solid rgba(0, 243, 255, 0.4);
            border-bottom: 1.5px solid rgba(0, 243, 255, 0.4);
            padding: 6px 0;
            font-size: 11px;
            font-weight: bold;
        }

        /* Navigation Footer */
        .footer-nav {
            display: flex;
            justify-content: space-around;
            background: #000103;
            padding: 8px 0;
            border-top: 1px solid rgba(0,243,255,0.25);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-size: 11px;
            color: #5d7a97;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-item.active {
            color: var(--neon-blue);
            text-shadow: 0 0 12px var(--neon-blue);
        }

        .blur-spin { filter: blur(6px); }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(10px);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-body {
            background: #031020;
            border-radius: 22px;
            border: 2px solid var(--neon-blue);
            padding: 26px;
            text-align: center;
            max-width: 320px;
            width: 100%;
            box-shadow: 0 0 45px var(--neon-glow);
        }

        .modal-btn {
            background: var(--neon-blue);
            color: #000;
            border: none;
            padding: 10px 28px;
            border-radius: 12px;
            font-weight: 900;
            margin-top: 16px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--neon-blue);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="top-bar">
        <div class="user-info">
            <div class="avatar" id="u-avatar">U</div>
            <span id="u-name" style="font-weight: bold; font-size: 0.85rem;">اللاعب</span>
        </div>
        <div class="logo">Golden Tree<br><span style="font-size: 11px; color: #a1e5ff;">Pro Master 2026</span></div>
        <div class="balance-badge">
            <span id="u-balance">0.00</span>
            <span style="font-size: 10px;">NSP</span>
        </div>
    </div>

    <!-- Top Widgets -->
    <div class="top-widgets">
        <div class="mini-badge" onclick="showModal('إعدادات اللعبة', 'نظام كازينو Golden Tree الاحترافي.')">
            <span>⚡ 3 سرعات</span>
            <span style="font-size: 8px; color: #8cf;">PRO HD</span>
        </div>
        <div class="mini-badge" style="border-color: var(--gold); color: var(--gold);" onclick="showModal('مهام اللاعبين', 'أكمل المهام اليومية واحصل على جوائز فورية!')">
            <span>🎁 المهام</span>
        </div>
        <div class="mini-badge" onclick="showModal('خيارات النظام', 'متصل آمن مع خوادم التيليجرام الذكية.')">
            <span>🔲 خيارات</span>
        </div>
    </div>

    <!-- Main Game Board -->
    <div class="game-container">
        <canvas id="lineCanvas"></canvas>
        <div class="slots-frame" id="slotsFrame"></div>
    </div>

    <!-- Win Info Banner -->
    <div class="info-panel">
        <div class="line-info" id="lineInfo">اختر الرهان واضغط ↻ للبدء</div>
        <div class="win-display">ربح <span id="winAmount">0.00</span> NSP</div>
    </div>

    <!-- Bet Selection Chips -->
    <div class="bets-container">
        <div class="bet-chip active" onclick="setBet(3, this)">3 NSP</div>
        <div class="bet-chip" onclick="setBet(6, this)">6 NSP</div>
        <div class="bet-chip" onclick="setBet(9, this)">9 NSP</div>
        <div class="bet-chip" onclick="setBet(15, this)">15 NSP</div>
        <div class="bet-chip" onclick="setBet(50, this)">50 NSP</div>
    </div>

    <!-- Action Buttons Bar -->
    <div class="controls">
        <div class="sub-btn" id="autoBtn" onclick="toggleAutoSpin()" title="دوران تلقائي">▶</div>
        <div class="sub-btn" id="speedBtn" onclick="cycleSpeed()" title="السرعة (بطيء، سريع، أسرع)">🐢</div>
        <button class="spin-btn" id="spinBtn" onclick="handleSpinButton()">↻</button>
        <div class="sub-btn" id="x2Btn" onclick="doubleBet()" title="مضاعفة الرهان">x2</div>
        <div class="sub-btn" onclick="showModal('الشحن والعملات', 'الرصيد مرتبط فوري بمحفظتك.')" title="عملات">🪙</div>
    </div>

    <!-- Bottom Stats -->
    <div class="history-bar">
        <div>🏆 أفضل ربح: <span id="bestWin" style="color: var(--gold);">0.00</span> NSP</div>
        <div>⏱️ آخر ربح: <span id="lastWin" style="color: var(--neon-blue);">0.00</span> NSP</div>
    </div>

    <!-- Navigation Footer -->
    <div class="footer-nav">
        <div class="nav-item active">
            <span>🎰</span>
            <span>اللعبة</span>
        </div>
        <div class="nav-item" onclick="showModal('لوحة الترتيب', 'أفضل اللاعبين هذا الأسبوع.')">
            <span>🏆</span>
            <span>الترتيب</span>
        </div>
        <div class="nav-item" onclick="showModal('حسابي', 'عرض تفاصيل الحساب والمعرف الشخصي.')">
            <span>👤</span>
            <span>حسابي</span>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="msg-modal">
        <div class="modal-body">
            <div id="modal-status" style="font-size: 1.15rem; font-weight: 900; color: var(--gold); margin-bottom: 8px;">تنبيه</div>
            <p id="modal-desc" style="color: #a1e5ff; font-size: 0.95rem; line-height: 1.5;"></p>
            <button class="modal-btn" onclick="closeModal()">استمرار 🚀</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        let userId = tg?.initDataUnsafe?.user?.id || 7255100997;
        let currentBet = 3;
        let isSpinning = false;
        let forceStopRequested = false;
        let currentBalance = 0.00;
        let autoSpinActive = false;
        let speedLevel = 1; // 1: بطيء, 2: سريع, 3: أسرع
        let autoInterval = null;

        const SYMBOLS = ['7', '🍊', '🍇', '🍒', '🔔', '🏺'];
        const reelsCount = 5;
        const reelElements = [];
        const slotsFrame = document.getElementById('slotsFrame');

        // محرك أصوات راقي ومريح جداً للأذن (Harmonic Melodic Audio)
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playProSound(type) {
            initAudio();
            if (!audioCtx) return;
            let now = audioCtx.currentTime;

            if (type === 'click') {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(900, now);
                osc.frequency.exponentialRampToValueAtTime(450, now + 0.04);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.linearRampToValueAtTime(0.001, now + 0.04);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.04);
            } 
            else if (type === 'spin') {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(280 + Math.random() * 70, now);
                gain.gain.setValueAtTime(0.025, now);
                gain.gain.linearRampToValueAtTime(0.001, now + 0.04);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.04);
            } 
            else if (type === 'jar_rare') {
                // رنين ذهبي أثري فاخر وناعم
                [783.99, 987.77, 1174.66, 1567.98].forEach((freq, i) => {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + (i * 0.05));
                    gain.gain.setValueAtTime(0.25, now + (i * 0.05));
                    gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.05) + 0.35);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now + (i * 0.05));
                    osc.stop(now + (i * 0.05) + 0.35);
                });
            }
            else if (type === 'win_epic') {
                // ألحان فوز ملكية هادئة ومبهجة
                let notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
                notes.forEach((freq, i) => {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + (i * 0.06));
                    gain.gain.setValueAtTime(0.2, now + (i * 0.06));
                    gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.06) + 0.4);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now + (i * 0.06));
                    osc.stop(now + (i * 0.06) + 0.4);
                });
            }
        }

        async function loadUserData() {
            try {
                const res = await fetch('/api/get_user_data', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: userId })
                });
                const data = await res.json();
                if (data.balance !== undefined) {
                    currentBalance = data.balance;
                    document.getElementById('u-balance').innerText = currentBalance.toFixed(2);
                    document.getElementById('u-name').innerText = data.name || "اللاعب";
                    document.getElementById('u-avatar').innerText = (data.name || "U")[0].toUpperCase();
                }
            } catch (err) {
                console.error("فشل إحضار البيانات:", err);
            }
        }
        loadUserData();

        for (let i = 0; i < reelsCount; i++) {
            const reel = document.createElement('div');
            reel.className = 'reel';
            const reelContainer = document.createElement('div');
            reelContainer.className = 'reel-container';
            reel.appendChild(reelContainer);
            slotsFrame.appendChild(reel);
            reelElements.push(reelContainer);
            fillReel(reelContainer, [getRandomSymbol(false), getRandomSymbol(false), getRandomSymbol(false)]);
        }

        // خوارزمية ظهور الجرة النادرة (تظهر وفق نسبة محسوبة بدقة عالية)
        function getRandomSymbol(allowJar = true) {
            const rand = Math.random();
            if (allowJar && rand < 0.008) return '🏺'; // نادرة جداً
            if (rand < 0.28) return '7';
            const fruits = ['🍊', '🍇', '🍒', '🔔'];
            return fruits[Math.floor(Math.random() * fruits.length)];
        }

        function createSymbolNode(sym) {
            const div = document.createElement('div');
            div.className = 'symbol';
            if (sym === '7') {
                div.classList.add('seven');
                div.innerHTML = '7';
            } else if (sym === '🏺') {
                div.classList.add('jar-rare');
                div.innerHTML = '🏺';
            } else {
                div.innerHTML = sym;
            }
            return div;
        }

        function fillReel(container, symbolsArray) {
            container.innerHTML = '';
            symbolsArray.forEach(sym => {
                container.appendChild(createSymbolNode(sym));
            });
        }

        function setBet(amount, el) {
            if (isSpinning) return;
            playProSound('click');
            currentBet = amount;
            document.querySelectorAll('.bet-chip').forEach(b => b.classList.remove('active'));
            if(el) el.classList.add('active');
        }

        function doubleBet() {
            playProSound('click');
            let bets = [3, 6, 9, 15, 50];
            let idx = bets.indexOf(currentBet);
            if (idx < bets.length - 1) {
                currentBet = bets[idx + 1];
            } else {
                currentBet = bets[0];
            }
            let chips = document.querySelectorAll('.bet-chip');
            chips.forEach((c, i) => {
                if(bets[i] === currentBet) {
                    chips.forEach(b => b.classList.remove('active'));
                    c.classList.add('active');
                }
            });
        }

        function toggleAutoSpin() {
            playProSound('click');
            autoSpinActive = !autoSpinActive;
            let btn = document.getElementById('autoBtn');
            if (autoSpinActive) {
                btn.classList.add('active-sub');
                startSpin();
                autoInterval = setInterval(() => {
                    if (!isSpinning) startSpin();
                }, 1800);
            } else {
                btn.classList.remove('active-sub');
                clearInterval(autoInterval);
            }
        }

        function cycleSpeed() {
            playProSound('click');
            speedLevel = (speedLevel % 3) + 1;
            let btn = document.getElementById('speedBtn');
            if (speedLevel === 1) {
                btn.innerText = '🐢';
                btn.title = 'بطيء';
            } else if (speedLevel === 2) {
                btn.innerText = '🚀';
                btn.title = 'سريع';
            } else {
                btn.innerText = '⚡';
                btn.title = 'أسرع';
            }
        }

        function handleSpinButton() {
            if (isSpinning) {
                forceStopRequested = true;
            } else {
                startSpin();
            }
        }

        async function startSpin() {
            if (isSpinning) return;
            if (currentBalance < currentBet) {
                showModal("❌ رصيد غير كافٍ", "يرجى شحن حسابك للبدء.");
                if (autoSpinActive) toggleAutoSpin();
                return;
            }

            isSpinning = true;
            forceStopRequested = false;
            document.getElementById('spinBtn').innerText = '⏹️';
            clearCanvas();
            document.getElementById('lineInfo').innerText = 'جاري التدوير...';
            document.getElementById('winAmount').innerText = '0.00';

            let serverResponse = null;
            try {
                const res = await fetch('/api/play_game', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: userId, bet: currentBet, game: 'goold_lera' })
                });
                serverResponse = await res.json();
            } catch (e) {
                console.warn("تنبيه اتصال السيرفر", e);
            }

            let finalGrid = [];
            let baseSpeed = speedLevel === 1 ? 1200 : (speedLevel === 2 ? 600 : 220);
            let jarCount = 0;

            const spinPromises = reelElements.map((reelContainer, index) => {
                return new Promise(resolve => {
                    setTimeout(() => {
                        reelContainer.classList.add('blur-spin');
                        let interval = setInterval(() => {
                            playProSound('spin');
                            fillReel(reelContainer, [getRandomSymbol(false), getRandomSymbol(false), getRandomSymbol(false)]);
                        }, forceStopRequested ? 10 : 35);

                        let currentWait = forceStopRequested ? 40 : (baseSpeed + index * 90);

                        setTimeout(() => {
                            clearInterval(interval);
                            reelContainer.classList.remove('blur-spin');
                            
                            let finalSyms = [getRandomSymbol(true), getRandomSymbol(false), getRandomSymbol(false)];
                            if (finalSyms.includes('🏺')) jarCount++;

                            fillReel(reelContainer, finalSyms);
                            finalGrid.push(finalSyms);
                            resolve();
                        }, currentWait);
                    }, forceStopRequested ? 0 : index * 20);
                });
            });

            await Promise.all(spinPromises);

            if (jarCount > 0) playProSound('jar_rare');

            if (serverResponse && serverResponse.new_balance !== undefined) {
                currentBalance = serverResponse.new_balance;
                document.getElementById('u-balance').innerText = currentBalance.toFixed(2);
            }

            evaluateGoldenTreeExactWin(finalGrid, serverResponse);
            isSpinning = false;
            forceStopRequested = false;
            document.getElementById('spinBtn').innerText = '↻';
        }

        // خوارزمية الربح الأصلية والمطابقة تماماً لطلبك الحرفي
        function evaluateGoldenTreeExactWin(grid, serverResponse) {
            let rows = [0, 1, 2].map(r => grid.map(reel => reel[r]));
            let totalMultiplier = 0;
            let matchedLines = [];

            // خطوط الفحص: أفقية (3 خطوط) + مائلة (قطريتين)
            let lineConfigs = [
                { type: 'horizontal', r: 0, path: [rows[0][0], rows[0][1], rows[0][2], rows[0][3], rows[0][4]] },
                { type: 'horizontal', r: 1, path: [rows[1][0], rows[1][1], rows[1][2], rows[1][3], rows[1][4]] },
                { type: 'horizontal', r: 2, path: [rows[2][0], rows[2][1], rows[2][2], rows[2][3], rows[2][4]] },
                { type: 'diagonal_down', r: 0, path: [rows[0][0], rows[1][1], rows[2][2], rows[1][3], rows[0][4]] },
                { type: 'diagonal_up', r: 2, path: [rows[2][0], rows[1][1], rows[0][2], rows[1][3], rows[2][4]] }
            ];

            lineConfigs.forEach((cfg) => {
                let symbolsOnLine = cfg.path;
                let first = symbolsOnLine[0];

                // الشرط الحاسم: لا يحدث أي ربح إذا كانت الرمز في عمود واحد، يجب أن يبدأ التسلسل من اليسار
                if (!first || first === '🏺') return;

                let base = first;
                let count = 0;

                for (let i = 0; i < symbolsOnLine.length; i++) {
                    let s = symbolsOnLine[i];
                    if (s === base || s === '🏺') {
                        count++;
                    } else {
                        break; // يتوقف فوراً عند أول انقطاع من اليسار لليمين
                    }
                }

                let mult = 0;
                if (base === '7') {
                    // السيبعات: ثنائية 2x، ثلاثية 3x، رباعية 5x، خماسية 20x
                    if (count === 2) mult = 2;
                    else if (count === 3) mult = 3;
                    else if (count === 4) mult = 5;
                    else if (count >= 5) mult = 20;
                } 
                else if (base === '🍇') {
                    // العنب: ثلاثية 2x، رباعية 3x، خماسية 10x
                    if (count === 3) mult = 2;
                    else if (count === 4) mult = 3;
                    else if (count >= 5) mult = 10;
                } 
                else if (['🍊', '🍒', '🔔'].includes(base)) {
                    // الفواكه الأخرى: ثلاثية 1x، رباعية 2x، خماسية 5x
                    if (count === 3) mult = 1;
                    else if (count === 4) mult = 2;
                    else if (count >= 5) mult = 5;
                }

                if (mult > 0) {
                    totalMultiplier += mult;
                    matchedLines.push({ config: cfg, mult, count, rowIdx: cfg.r, type: cfg.type });
                }
            });

            let winAmount = 0;
            if (serverResponse && serverResponse.win) {
                winAmount = serverResponse.win_amount;
            } else if (!serverResponse || !serverResponse.win) {
                totalMultiplier = 0;
                winAmount = 0;
            }

            if (winAmount > 0) {
                playProSound('win_epic');
                document.getElementById('winAmount').innerText = winAmount.toFixed(2);
                document.getElementById('lineInfo').innerText = `مبروك! ربحت ${winAmount.toFixed(2)} NSP`;
                document.getElementById('lastWin').innerText = winAmount.toFixed(2);

                let best = parseFloat(document.getElementById('bestWin').innerText);
                if (winAmount > best) document.getElementById('bestWin').innerText = winAmount.toFixed(2);

                confetti({ particleCount: 160, spread: 110, origin: { y: 0.6 } });
                drawWinningLines(matchedLines);
            } else {
                document.getElementById('winAmount').innerText = '0.00';
                document.getElementById('lineInfo').innerText = 'حظ أوفر في الضربة القادمة';
                clearCanvas();
            }
        }

        // رسم خطوط تفصيلية لشرح الربح بدقة تامة للمستخدم
        function drawWinningLines(lines) {
            const canvas = document.getElementById('lineCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            let rowHeight = canvas.height / 3;

            lines.forEach(l => {
                ctx.beginPath();
                if (l.type === 'horizontal') {
                    let y = (l.rowIdx * rowHeight) + (rowHeight / 2);
                    ctx.moveTo(10, y);
                    ctx.lineTo(canvas.width - 10, y);
                } else if (l.type === 'diagonal_down') {
                    ctx.moveTo(10, 15);
                    ctx.lineTo(canvas.width - 10, canvas.height - 15);
                } else if (l.type === 'diagonal_up') {
                    ctx.moveTo(10, canvas.height - 15);
                    ctx.lineTo(canvas.width - 10, 15);
                }
                ctx.strokeStyle = '#00f3ff';
                ctx.lineWidth = 5.5;
                ctx.shadowColor = '#00f3ff';
                ctx.shadowBlur = 22;
                ctx.stroke();
            });
        }

        function clearCanvas() {
            const canvas = document.getElementById('lineCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function showModal(title, desc) {
            playProSound('click');
            document.getElementById('modal-status').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('msg-modal').style.display = 'flex';
        }

        function closeModal() {
            playProSound('click');
            document.getElementById('msg-modal').style.display = 'none';
        }
    </script>
