<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Golden Lera - Pro Master 2026</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-glow: rgba(0, 243, 255, 0.85);
            --gold: #ffdf00;
            --gold-glow: rgba(255, 223, 0, 0.9);
            --bg-dark: #000206;
            --card-bg: rgba(2, 12, 25, 0.99);
            --purple-glow: rgba(187, 0, 255, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at center, #08294d 0%, var(--bg-dark) 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background: rgba(1, 5, 12, 0.99);
            border-bottom: 1.5px solid rgba(0, 243, 255, 0.4);
            backdrop-filter: blur(15px);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), #ff8800);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #000;
            box-shadow: 0 0 18px var(--gold-glow);
        }

        .logo {
            text-align: center;
            font-size: 19px;
            font-weight: 900;
            background: linear-gradient(180deg, #fff 0%, var(--gold) 50%, #b38f00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 18px rgba(255, 223, 0, 0.6);
            line-height: 1.1;
        }

        .balance-badge {
            background: rgba(0, 243, 255, 0.12);
            border: 1.5px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 15px var(--neon-glow);
        }

        .top-widgets {
            display: flex;
            justify-content: space-between;
            padding: 4px 14px;
        }

        .mini-badge {
            border: 1px solid var(--neon-blue);
            border-radius: 12px;
            padding: 4px 10px;
            font-size: 10px;
            background: rgba(0,30,60,0.85);
            color: var(--neon-blue);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .mini-badge:active { transform: scale(0.95); }

        .game-container {
            position: relative;
            width: 95%;
            max-width: 420px;
            margin: 4px auto 0;
            perspective: 1000px;
        }

        .slots-frame {
            display: flex;
            flex-direction: row; /* يضمن الترتيب من اليمين لليسار مع dir=rtl */
            gap: 4px;
            background: rgba(1, 5, 12, 0.99);
            border: 3px solid var(--neon-blue);
            box-shadow: 0 0 45px var(--neon-glow), inset 0 0 25px var(--neon-glow);
            border-radius: 18px;
            padding: 6px;
            position: relative;
            overflow: hidden;
            height: 252px;
        }

        .slots-frame.shake {
            animation: screenShake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes screenShake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        .reel {
            flex: 1;
            height: 240px;
            background: rgba(2, 12, 25, 0.5);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
        }

        .reel-strip {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            will-change: transform;
        }

        .reel-strip.spinning {
            animation: fastSpin 0.09s linear infinite;
        }

        .reel-strip.bounce-stop {
            animation: reelBounce 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes fastSpin {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-240px); }
        }

        @keyframes reelBounce {
            0% { transform: translateY(-18px); }
            70% { transform: translateY(6px); }
            100% { transform: translateY(0); }
        }

        .symbol {
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            flex-shrink: 0;
        }

        .symbol-badge {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            font-size: 50px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 6px 8px rgba(0,0,0,0.6));
        }

        /* أنيميشن الجرة الذهبية المحسّن */
        .symbol.jar-rare .symbol-badge {
            background: radial-gradient(circle, rgba(255,223,0,0.5) 0%, rgba(255,170,0,0.2) 50%, transparent 80%);
            font-size: 58px;
            animation: goldenJarGlow 1s infinite alternate ease-in-out;
        }

        @keyframes goldenJarGlow {
            0% { transform: scale(0.95) rotate(-3deg); filter: drop-shadow(0 0 15px var(--gold)) brightness(1); }
            100% { transform: scale(1.12) rotate(3deg); filter: drop-shadow(0 0 35px var(--gold)) brightness(1.4); }
        }

        .symbol.jar-win-full {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 240px !important;
            z-index: 50;
            animation: jarExpandReel 0.6s forwards cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .symbol.jar-win-full .symbol-badge {
            width: 100%;
            height: 100%;
            font-size: 115px;
            background: radial-gradient(circle, rgba(255, 245, 150, 0.95) 0%, rgba(255, 170, 0, 0.7) 45%, transparent 85%);
            filter: drop-shadow(0 0 55px var(--gold));
        }

        @keyframes jarExpandReel {
            0% { transform: scale(0.1) translateY(80px); opacity: 0; }
            50% { transform: scale(1.2) translateY(-10px); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .jar-mult-tag {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: linear-gradient(135deg, #ff0055, #ff00aa);
            color: #fff;
            font-size: 14px;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 12px;
            border: 1px solid #fff;
            box-shadow: 0 0 15px #ff0055;
            z-index: 55;
        }

        .symbol.seven .symbol-badge {
            color: #ff0055;
            text-shadow: 0 0 25px rgba(255, 0, 85, 0.9), 0 4px 6px rgba(0,0,0,0.8);
            font-weight: 900;
            font-style: italic;
            font-size: 55px;
        }

        .symbol.win-pop .symbol-badge {
            animation: symbolWinAnim 0.5s infinite alternate ease-in-out;
            z-index: 10;
        }

        @keyframes symbolWinAnim {
            0% { transform: scale(1); filter: drop-shadow(0 0 15px var(--gold-glow)) brightness(1.1); }
            100% { transform: scale(1.3); filter: drop-shadow(0 0 45px var(--gold)) brightness(1.6); }
        }

        .jar-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(135deg, #ff0055, #ffaa00);
            border: 3px solid #fff;
            padding: 12px 24px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 20px;
            color: #fff;
            box-shadow: 0 0 50px var(--gold);
            z-index: 100;
            pointer-events: none;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
        }
        .jar-banner.show { transform: translate(-50%, -50%) scale(1.15); }

        .info-panel { text-align: center; margin: 4px 0; }
        .line-info {
            color: var(--neon-blue);
            font-size: 13px;
            font-weight: 700;
            text-shadow: 0 0 12px var(--neon-blue);
            min-height: 20px;
        }
        .win-display {
            font-size: 23px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 18px var(--neon-blue);
        }

        .bets-container {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 6px;
            padding: 0 10px;
        }
        .bet-chip {
            padding: 6px 12px;
            border-radius: 16px;
            border: 1.5px solid var(--neon-blue);
            background: rgba(0, 30, 60, 0.9);
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-glow);
            transition: all 0.2s;
        }
        .bet-chip.active {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 25px var(--neon-blue);
            font-weight: 900;
            transform: scale(1.08);
        }

        .controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 14px;
            margin-bottom: 6px;
        }
        .spin-btn {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            border: 3.5px solid var(--neon-blue);
            background: radial-gradient(circle, rgba(0,243,255,0.95) 0%, rgba(1,5,12,0.99) 100%);
            box-shadow: 0 0 40px var(--neon-blue), inset 0 0 22px var(--neon-blue);
            color: #fff;
            font-size: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.15s;
        }
        .spin-btn:active { transform: scale(0.9); }

        .sub-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1.5px solid var(--neon-blue);
            background: rgba(1, 5, 12, 0.92);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-glow);
            transition: 0.2s;
        }
        .sub-btn.active-sub {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
            box-shadow: 0 0 20px var(--gold);
        }

        .history-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(1, 5, 12, 0.99);
            border-top: 1.5px solid rgba(0, 243, 255, 0.4);
            border-bottom: 1.5px solid rgba(0, 243, 255, 0.4);
            padding: 6px 0;
            font-size: 11px;
            font-weight: bold;
        }

        .footer-nav {
            display: flex;
            justify-content: space-around;
            background: #000103;
            padding: 8px 0;
            border-top: 1px solid rgba(0,243,255,0.25);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-size: 11px;
            color: #5d7a97;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-item.active {
            color: var(--neon-blue);
            text-shadow: 0 0 12px var(--neon-blue);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(10px);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-body {
            background: #031020;
            border-radius: 22px;
            border: 2px solid var(--neon-blue);
            padding: 26px;
            text-align: center;
            max-width: 320px;
            width: 100%;
            box-shadow: 0 0 45px var(--neon-glow);
        }
        .modal-btn {
            background: var(--neon-blue);
            color: #000;
            border: none;
            padding: 10px 28px;
            border-radius: 12px;
            font-weight: 900;
            margin-top: 16px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--neon-blue);
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="user-info">
            <div class="avatar" id="u-avatar">U</div>
            <span id="u-name" style="font-weight: bold; font-size: 0.85rem;">جاري التحميل...</span>
        </div>
        <div class="logo">Golden Tree<br><span style="font-size: 11px; color: #a1e5ff;">Pro Master 2026</span></div>
        <div class="balance-badge">
            <span id="u-balance">0.00</span>
            <span style="font-size: 10px;">NSP</span>
        </div>
    </div>

    <div class="top-widgets">
        <div class="mini-badge" onclick="showModal('إعدادات اللعبة', 'نظام كازينو Golden Tree الاحترافي المربوط بالبوت.')">
            <span>⚡ 3 سرعات</span>
            <span style="font-size: 8px; color: #8cf;">PRO HD</span>
        </div>
        <div class="mini-badge" style="border-color: var(--gold); color: var(--gold);" onclick="showModal('مهام اللاعبين', 'أكمل المهام اليومية من البوت واحصل على مكافآت!')">
            <span>🎁 المهام</span>
        </div>
        <div class="mini-badge" onclick="showModal('خيارات النظام', 'متصل آمن مع خوادم البوت وقاعدة البيانات.')">
            <span>🔲 خيارات</span>
        </div>
    </div>

    <div class="game-container">
        <div class="jar-banner" id="jarBanner">مضاعف الجرة الذهبية! <br> <span id="jarMultText" style="font-size: 28px; color: var(--gold);">5x</span></div>
        <div class="slots-frame" id="slotsFrame"></div>
    </div>

    <div class="info-panel">
        <div class="line-info" id="lineInfo">اختر الرهان واضغط ↻ للبدء</div>
        <div class="win-display">ربح <span id="winAmount">0.00</span> NSP</div>
    </div>

    <div class="bets-container">
        <div class="bet-chip active" onclick="setBet(3, this)">3 NSP</div>
        <div class="bet-chip" onclick="setBet(6, this)">6 NSP</div>
        <div class="bet-chip" onclick="setBet(9, this)">9 NSP</div>
        <div class="bet-chip" onclick="setBet(15, this)">15 NSP</div>
        <div class="bet-chip" onclick="setBet(50, this)">50 NSP</div>
    </div>

    <div class="controls">
        <div class="sub-btn" id="autoBtn" onclick="toggleAutoSpin()" title="دوران تلقائي">▶</div>
        <div class="sub-btn" id="speedBtn" onclick="cycleSpeed()" title="السرعة">🐢</div>
        <button class="spin-btn" id="spinBtn" onclick="handleSpinButton()">↻</button>
        <div class="sub-btn" onclick="doubleBet()" title="مضاعفة الرهان">x2</div>
        <div class="sub-btn" onclick="loadUserData()" title="تحديث الرصيد">🔄</div>
    </div>

    <div class="history-bar">
        <div>🏆 أفضل ربح: <span id="bestWin" style="color: var(--gold);">0.00</span> NSP</div>
        <div>⏱️ آخر ربح: <span id="lastWin" style="color: var(--neon-blue);">0.00</span> NSP</div>
    </div>

    <div class="footer-nav">
        <div class="nav-item active">
            <span>🎰</span>
            <span>اللعبة</span>
        </div>
        <div class="nav-item" onclick="showModal('لوحة الترتيب', 'أفضل اللاعبين المسجلين في البوت.')">
            <span>🏆</span>
            <span>الترتيب</span>
        </div>
        <div class="nav-item" onclick="showModal('حسابي', 'عرض تفاصيل الحساب والمعرف المسجل في البوت.')">
            <span>👤</span>
            <span>حسابي</span>
        </div>
    </div>

    <div class="modal" id="msg-modal">
        <div class="modal-body">
            <div id="modal-status" style="font-size: 1.15rem; font-weight: 900; color: var(--gold); margin-bottom: 8px;">تنبيه</div>
            <p id="modal-desc" style="color: #a1e5ff; font-size: 0.95rem; line-height: 1.5;"></p>
            <button class="modal-btn" onclick="closeModal()">استمرار 🚀</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        let currentBet = 3;
        let isSpinning = false;
        let forceStopRequested = false;
        let currentBalance = 0.00;
        let autoSpinActive = false;
        let speedLevel = 1;
        let autoInterval = null;

        const reelsCount = 5;
        const reelStrips = [];
        const slotsFrame = document.getElementById('slotsFrame');

        // ==========================================
        //  محرك الصوت المُحسّن (صوت الجرة الذهبية)
        // ==========================================
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playProSound(type) {
            initAudio();
            if (!audioCtx) return;
            let now = audioCtx.currentTime;

            if (type === 'click') {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(700, now);
                osc.frequency.exponentialRampToValueAtTime(350, now + 0.06);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.06);
            } 
            else if (type === 'spin_tick') {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(60, now + 0.03);
                gain.gain.setValueAtTime(0.04, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.03);
            }
            else if (type === 'reel_stop') {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.12);
            }
            // صوت رنين معدني فاخر للجرة الذهبية (Golden Jar SFX)
            else if (type === 'jar_appear') {
                let freqs = [987.77, 1318.51, 1758.24, 2637.02];
                freqs.forEach((freq, i) => {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + (i * 0.04));
                    gain.gain.setValueAtTime(0.18, now + (i * 0.04));
                    gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.04) + 0.4);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now + (i * 0.04));
                    osc.stop(now + (i * 0.04) + 0.4);
                });
            }
            else if (type === 'jar_expand') {
                let chord = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98, 2093.00];
                chord.forEach((freq, i) => {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + (i * 0.05));
                    gain.gain.setValueAtTime(0.2, now + (i * 0.05));
                    gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.05) + 0.6);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now + (i * 0.05));
                    osc.stop(now + (i * 0.05) + 0.6);
                });
            }
            else if (type === 'win_sound') {
                let notes = [587.33, 739.99, 880.00, 1174.66];
                notes.forEach((freq, i) => {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + (i * 0.05));
                    gain.gain.setValueAtTime(0.15, now + (i * 0.05));
                    gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.05) + 0.35);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now + (i * 0.05));
                    osc.stop(now + (i * 0.05) + 0.35);
                });
            }
        }

        // ==========================================
        //  الاتصال بالسيرفر وجلب رصيد البوت الحقيقي
        // ==========================================
        async function loadUserData() {
            let tgUser = tg?.initDataUnsafe?.user;
            let userId = tgUser?.id || "demo_user";
            let name = tgUser?.first_name || "اللاعب";

            document.getElementById('u-name').innerText = name;
            document.getElementById('u-avatar').innerText = name[0].toUpperCase();

            try {
                let response = await fetch('/api/get_user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, name: name })
                });
                let data = await response.json();
                if (data.success) {
                    currentBalance = parseFloat(data.balance);
                    document.getElementById('u-balance').innerText = currentBalance.toFixed(2);
                }
            } catch (e) {
                console.error("خطأ في الاتصال بسيرفر البوت:", e);
                document.getElementById('lineInfo').innerText = 'تعذر الاتصال بالسيرفر!';
            }
        }

        loadUserData();

        // بناء بكرات اللعبة
        for (let i = 0; i < reelsCount; i++) {
            const reel = document.createElement('div');
            reel.className = 'reel';
            
            const reelStrip = document.createElement('div');
            reelStrip.className = 'reel-strip';
            reel.appendChild(reelStrip);
            slotsFrame.appendChild(reel);
            
            reelStrips.push(reelStrip);
            populateStrip(reelStrip, generateInitialList(6));
        }

        function generateInitialList(count) {
            const items = ['🍋', '🍍', '🍊', '🍒', '🔔', '🍇', '7'];
            let list = [];
            for (let i = 0; i < count; i++) {
                let sym = items[Math.floor(Math.random() * items.length)];
                list.push({ sym: sym, mult: 1 });
            }
            return list;
        }

        function createSymbolNode(symObj) {
            const div = document.createElement('div');
            div.className = 'symbol';
            
            const badge = document.createElement('div');
            badge.className = 'symbol-badge';

            if (symObj.sym === '7') {
                div.classList.add('seven');
                badge.innerText = '7';
            } else if (symObj.sym === '🏺') {
                div.classList.add('jar-rare');
                badge.innerText = '🏺';
                if (symObj.mult > 1) {
                    const multTag = document.createElement('div');
                    multTag.className = 'jar-mult-tag';
                    multTag.innerText = symObj.mult + 'x';
                    badge.appendChild(multTag);
                }
            } else {
                badge.innerText = symObj.sym;
            }

            div.appendChild(badge);
            return div;
        }

        function populateStrip(strip, symbolsArray) {
            strip.innerHTML = '';
            symbolsArray.forEach(symObj => {
                strip.appendChild(createSymbolNode(symObj));
            });
        }

        function setBet(amount, el) {
            if (isSpinning) return;
            playProSound('click');
            currentBet = amount;
            document.querySelectorAll('.bet-chip').forEach(b => b.classList.remove('active'));
            if(el) el.classList.add('active');
        }

        function doubleBet() {
            if (isSpinning) return;
            playProSound('click');
            let bets = [3, 6, 9, 15, 50];
            let idx = bets.indexOf(currentBet);
            currentBet = (idx < bets.length - 1) ? bets[idx + 1] : bets[0];
            let chips = document.querySelectorAll('.bet-chip');
            chips.forEach((c, i) => {
                c.classList.toggle('active', bets[i] === currentBet);
            });
        }

        function toggleAutoSpin() {
            playProSound('click');
            autoSpinActive = !autoSpinActive;
            let btn = document.getElementById('autoBtn');
            if (autoSpinActive) {
                btn.classList.add('active-sub');
                startSpin();
                autoInterval = setInterval(() => {
                    if (!isSpinning) startSpin();
                }, 1600);
            } else {
                btn.classList.remove('active-sub');
                clearInterval(autoInterval);
            }
        }

        function cycleSpeed() {
            playProSound('click');
            speedLevel = (speedLevel % 3) + 1;
            let btn = document.getElementById('speedBtn');
            btn.innerText = speedLevel === 1 ? '🐢' : (speedLevel === 2 ? '🚀' : '⚡');
        }

        function handleSpinButton() {
            initAudio();
            if (isSpinning) {
                forceStopRequested = true;
            } else {
                startSpin();
            }
        }

        // ==========================================
        //  بدء التدوير وارتباط خوارزمية الربح بالسيرفر
        // ==========================================
        async function startSpin() {
            if (isSpinning) return;
            
            if (currentBalance < currentBet) {
                showModal("❌ رصيد غير كافٍ", "يرجى شحن حسابك من البوت لمتابعة اللعب!");
                if (autoSpinActive) toggleAutoSpin();
                return;
            }

            isSpinning = true;
            forceStopRequested = false;
            
            let tgUser = tg?.initDataUnsafe?.user;
            let userId = tgUser?.id || "demo_user";

            document.getElementById('spinBtn').innerText = '⏹️';
            clearShineEffects();
            hideJarBanner();
            document.getElementById('lineInfo').innerText = 'جاري طلب النتيجة من البوت...';

            let spinSoundInterval = setInterval(() => {
                if (isSpinning) playProSound('spin_tick');
            }, 55);

            // بدء أنيميشن الدوران بجميع البكرات
            reelStrips.forEach(strip => {
                populateStrip(strip, generateInitialList(9));
                strip.classList.add('spinning');
            });

            // إرسال الطلب لخوارزمية الربح بالسيرفر
            let serverResult = null;
            try {
                let response = await fetch('/api/play_spin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, bet: currentBet })
                });
                serverResult = await response.json();
            } catch (err) {
                console.error("خطأ معالجة التدويرة من البوت:", err);
            }

            if (!serverResult || !serverResult.success) {
                clearInterval(spinSoundInterval);
                isSpinning = false;
                document.getElementById('spinBtn').innerText = '↻';
                document.getElementById('lineInfo').innerText = serverResult?.message || 'فشل الاتصال بالسيرفر';
                reelStrips.forEach(s => s.classList.remove('spinning'));
                return;
            }

            // تحديث الرصيد بعد الخصم/الربح المعتمد من السيرفر
            currentBalance = parseFloat(serverResult.new_balance);
            document.getElementById('u-balance').innerText = currentBalance.toFixed(2);

            let finalGrid = serverResult.grid; // الشبكة المحسوبة من البوت

            // ==========================================
            //  التوقف والتتابع الحركي من اليمين إلى اليسار (0 -> 4)
            // ==========================================
            let baseWait = speedLevel === 1 ? 500 : (speedLevel === 2 ? 280 : 100);
            let stepDelay = speedLevel === 1 ? 180 : (speedLevel === 2 ? 90 : 40);

            // الترتيب من اليمين لليسار: العمود 0 (اليمين) إلى العمود 4 (اليسار)
            const stopOrderRightToLeft = [0, 1, 2, 3, 4];

            for (let step = 0; step < stopOrderRightToLeft.length; step++) {
                let reelIdx = stopOrderRightToLeft[step];
                let currentDelay = forceStopRequested ? (step * 25) : (baseWait + step * stepDelay);

                await new Promise(resolve => setTimeout(resolve, currentDelay));

                let strip = reelStrips[reelIdx];
                strip.classList.remove('spinning');

                let columnData = finalGrid[reelIdx];
                populateStrip(strip, columnData);

                strip.classList.add('bounce-stop');
                setTimeout(() => strip.classList.remove('bounce-stop'), 220);

                let hasJar = columnData.some(s => s && s.sym === '🏺');
                if (hasJar) {
                    playProSound('jar_appear');
                } else {
                    playProSound('reel_stop');
                }
            }

            clearInterval(spinSoundInterval);
            
            // تطبيق النتائج المرجعة من خوارزمية البوت
            displaySpinResults(serverResult);

            isSpinning = false;
            forceStopRequested = false;
            document.getElementById('spinBtn').innerText = '↻';
        }

        // ==========================================
        //  عرض الأرباح والربط الحركي من اليمين
        // ==========================================
        function displaySpinResults(res) {
            let winAmount = parseFloat(res.win_amount);
            document.getElementById('winAmount').innerText = winAmount.toFixed(2);

            if (winAmount > 0) {
                playProSound('win_sound');
                document.getElementById('lineInfo').innerText = `مبروك! ربحت ${winAmount.toFixed(2)} NSP`;
                document.getElementById('lastWin').innerText = winAmount.toFixed(2);

                let best = parseFloat(document.getElementById('bestWin').innerText);
                if (winAmount > best) document.getElementById('bestWin').innerText = winAmount.toFixed(2);

                if (res.has_jar) {
                    expandJarToFullReel(res.jar_reel_index, res.jar_multiplier || 2);
                    triggerScreenShake();
                    showJarBanner(res.jar_multiplier || 2);
                }

                confetti({ particleCount: 160, spread: 110, origin: { y: 0.6 } });
                applyShineToWinners(res.winning_coords || []);
            } else {
                document.getElementById('lineInfo').innerText = 'حظ أوفر في المحاولة القادمة';
            }
        }

        function expandJarToFullReel(reelIndex, mult) {
            if (reelIndex === undefined || reelIndex < 0 || reelIndex >= reelsCount) return;
            
            playProSound('jar_expand');

            const reelStrip = reelStrips[reelIndex];
            reelStrip.innerHTML = '';

            const fullJarNode = document.createElement('div');
            fullJarNode.className = 'symbol jar-win-full';

            const badge = document.createElement('div');
            badge.className = 'symbol-badge';
            badge.innerText = '🏺';

            if (mult > 1) {
                const multTag = document.createElement('div');
                multTag.className = 'jar-mult-tag';
                multTag.style.fontSize = '18px';
                multTag.innerText = mult + 'x';
                badge.appendChild(multTag);
            }

            fullJarNode.appendChild(badge);
            reelStrip.appendChild(fullJarNode);
        }

        function triggerScreenShake() {
            slotsFrame.classList.add('shake');
            setTimeout(() => slotsFrame.classList.remove('shake'), 500);
        }

        function showJarBanner(mult) {
            const banner = document.getElementById('jarBanner');
            document.getElementById('jarMultText').innerText = mult + 'x';
            banner.classList.add('show');
            setTimeout(() => banner.classList.remove('show'), 2200);
        }

        function hideJarBanner() {
            document.getElementById('jarBanner').classList.remove('show');
        }

        function applyShineToWinners(coords) {
            coords.forEach(([reelIdx, rowIdx]) => {
                let reelStrip = reelStrips[reelIdx];
                if (reelStrip && reelStrip.children[rowIdx]) {
                    reelStrip.children[rowIdx].classList.add('win-pop');
                }
            });
        }

        function clearShineEffects() {
            document.querySelectorAll('.symbol').forEach(s => s.classList.remove('win-pop'));
        }

        function showModal(title, desc) {
            playProSound('click');
            document.getElementById('modal-status').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('msg-modal').style.display = 'flex';
        }

        function closeModal() {
            playProSound('click');
            document.getElementById('msg-modal').style.display = 'none';
        }
    </script>
</body>
</html>
