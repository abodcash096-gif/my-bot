<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Golden Tree - Ultra Pro Edition 2026</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-glow: rgba(0, 243, 255, 0.85);
            --gold: #ffdf00;
            --gold-glow: rgba(255, 223, 0, 0.9);
            --bg-dark: #000206;
            --card-bg: rgba(2, 12, 25, 0.99);
            --purple-glow: #b026ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at center, #06203d 0%, var(--bg-dark) 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background: rgba(1, 5, 12, 0.99);
            border-bottom: 1.5px solid rgba(0, 243, 255, 0.4);
            backdrop-filter: blur(15px);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), #ff8800);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #000;
            box-shadow: 0 0 18px var(--gold-glow);
        }

        .logo {
            text-align: center;
            font-size: 19px;
            font-weight: 900;
            background: linear-gradient(180deg, #fff 0%, var(--gold) 50%, #b38f00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 18px rgba(255, 223, 0, 0.6);
            line-height: 1.1;
        }

        .balance-badge {
            background: rgba(0, 243, 255, 0.12);
            border: 1.5px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 15px var(--neon-glow);
        }

        /* Top Widgets */
        .top-widgets {
            display: flex;
            justify-content: space-between;
            padding: 4px 14px;
        }

        .mini-badge {
            border: 1px solid var(--neon-blue);
            border-radius: 12px;
            padding: 4px 10px;
            font-size: 10px;
            background: rgba(0,30,60,0.85);
            color: var(--neon-blue);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .mini-badge:active { transform: scale(0.95); }

        /* Game Slots Grid Frame */
        .game-container {
            position: relative;
            width: 95%;
            max-width: 420px;
            margin: 4px auto 0;
            perspective: 1000px;
        }

        .slots-frame {
            display: flex;
            gap: 4px;
            background: rgba(1, 5, 12, 0.99);
            border: 3px solid var(--neon-blue);
            box-shadow: 0 0 45px var(--neon-glow), inset 0 0 25px var(--neon-glow);
            border-radius: 18px;
            padding: 6px;
            position: relative;
            overflow: hidden;
            transition: transform 0.1s ease;
        }

        .slots-frame.shake {
            animation: screenShake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes screenShake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        .reel {
            flex: 1;
            height: 240px;
            background: var(--card-bg);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        .reel-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* تصميم الرموز ثلاثي الأبعاد والاحترافي */
        .symbol {
            height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 38px;
            position: relative;
            transition: all 0.3s ease;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.7));
        }

        .symbol-badge {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.15), rgba(0,0,0,0.4));
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* الجرة الذهبية النادرة الفاخرة */
        .symbol.jar-rare .symbol-badge {
            background: radial-gradient(circle, #ffe600 0%, #ff6600 70%, #883300 100%);
            border: 2px solid var(--gold);
            box-shadow: 0 0 25px var(--gold-glow), inset 0 0 15px #fff;
            animation: jarPulse 0.8s infinite alternate ease-in-out;
        }

        .jar-mult-tag {
            position: absolute;
            bottom: -4px;
            right: -4px;
            background: #ff0055;
            color: #fff;
            font-size: 11px;
            font-weight: 900;
            padding: 1px 6px;
            border-radius: 10px;
            border: 1px solid #fff;
            box-shadow: 0 0 10px #ff0055;
            z-index: 5;
        }

        @keyframes jarPulse {
            0% { transform: scale(0.95); filter: drop-shadow(0 0 10px var(--gold)); }
            100% { transform: scale(1.08); filter: drop-shadow(0 0 30px var(--gold)); }
        }

        /* السبعات المتوهجة */
        .symbol.seven .symbol-badge {
            background: radial-gradient(circle, #00ffff 0%, #0044ff 100%);
            border: 2px solid #00f3ff;
            box-shadow: 0 0 20px var(--neon-glow);
        }
        .symbol.seven {
            color: #fff;
            text-shadow: 0 0 15px #00ffff, 0 0 30px #0088ff;
            font-weight: 900;
            font-style: italic;
        }

        /* أنيميشن الفوز للرمز */
        .symbol.win-pop {
            animation: symbolWinAnim 0.6s infinite alternate cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }

        @keyframes symbolWinAnim {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.22); filter: brightness(1.6) drop-shadow(0 0 20px var(--gold)); }
        }

        #lineCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 15;
        }

        /* Floating Banner for Jar Multipliers */
        .jar-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(135deg, #ff0055, #ffaa00);
            border: 3px solid #fff;
            padding: 12px 24px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 20px;
            color: #fff;
            box-shadow: 0 0 50px var(--gold);
            z-index: 100;
            pointer-events: none;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }
        .jar-banner.show {
            transform: translate(-50%, -50%) scale(1.1);
        }

        /* Win Info Banner */
        .info-panel {
            text-align: center;
            margin: 4px 0;
        }

        .line-info {
            color: var(--neon-blue);
            font-size: 13px;
            font-weight: 700;
            text-shadow: 0 0 12px var(--neon-blue);
            min-height: 20px;
        }

        .win-display {
            font-size: 23px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 18px var(--neon-blue);
        }

        /* Bet Selection Chips */
        .bets-container {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 6px;
            padding: 0 10px;
        }

        .bet-chip {
            padding: 6px 12px;
            border-radius: 16px;
            border: 1.5px solid var(--neon-blue);
            background: rgba(0, 30, 60, 0.9);
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-glow);
            transition: all 0.2s;
        }

        .bet-chip.active {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 25px var(--neon-blue);
            font-weight: 900;
            transform: scale(1.08);
        }

        /* Controls Bar */
        .controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 14px;
            margin-bottom: 6px;
        }

        .spin-btn {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            border: 3.5px solid var(--neon-blue);
            background: radial-gradient(circle, rgba(0,243,255,0.9) 0%, rgba(1,5,12,0.99) 100%);
            box-shadow: 0 0 40px var(--neon-blue), inset 0 0 22px var(--neon-blue);
            color: #fff;
            font-size: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .spin-btn:active { transform: scale(0.9); }

        .sub-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1.5px solid var(--neon-blue);
            background: rgba(1, 5, 12, 0.92);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-glow);
            transition: 0.2s;
        }
        .sub-btn.active-sub {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
            box-shadow: 0 0 20px var(--gold);
        }

        /* Bottom Stats */
        .history-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(1, 5, 12, 0.99);
            border-top: 1.5px solid rgba(0, 243, 255, 0.4);
            border-bottom: 1.5px solid rgba(0, 243, 255, 0.4);
            padding: 6px 0;
            font-size: 11px;
            font-weight: bold;
        }

        /* Navigation Footer */
        .footer-nav {
            display: flex;
            justify-content: space-around;
            background: #000103;
            padding: 8px 0;
            border-top: 1px solid rgba(0,243,255,0.25);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-size: 11px;
            color: #5d7a97;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-item.active {
            color: var(--neon-blue);
            text-shadow: 0 0 12px var(--neon-blue);
        }

        .blur-spin { filter: blur(8px); }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(10px);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-body {
            background: #031020;
            border-radius: 22px;
            border: 2px solid var(--neon-blue);
            padding: 26px;
            text-align: center;
            max-width: 320px;
            width: 100%;
            box-shadow: 0 0 45px var(--neon-glow);
        }

        .modal-btn {
            background: var(--neon-blue);
            color: #000;
            border: none;
            padding: 10px 28px;
            border-radius: 12px;
            font-weight: 900;
            margin-top: 16px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--neon-blue);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="top-bar">
        <div class="user-info">
            <div class="avatar" id="u-avatar">U</div>
            <span id="u-name" style="font-weight: bold; font-size: 0.85rem;">اللاعب</span>
        </div>
        <div class="logo">Golden Tree<br><span style="font-size: 11px; color: #a1e5ff;">Pro Master 2026</span></div>
        <div class="balance-badge">
            <span id="u-balance">0.00</span>
            <span style="font-size: 10px;">NSP</span>
        </div>
    </div>

    <!-- Top Widgets -->
    <div class="top-widgets">
        <div class="mini-badge" onclick="showModal('إعدادات اللعبة', 'نظام كازينو Golden Tree الاحترافي.')">
            <span>⚡ 3 سرعات</span>
            <span style="font-size: 8px; color: #8cf;">PRO HD</span>
        </div>
        <div class="mini-badge" style="border-color: var(--gold); color: var(--gold);" onclick="showModal('مهام اللاعبين', 'أكمل المهام اليومية واحصل على جوائز فورية!')">
            <span>🎁 المهام</span>
        </div>
        <div class="mini-badge" onclick="showModal('خيارات النظام', 'متصل آمن مع خوادم التيليجرام الذكية.')">
            <span>🔲 خيارات</span>
        </div>
    </div>

    <!-- Main Game Board -->
    <div class="game-container">
        <canvas id="lineCanvas"></canvas>
        <div class="jar-banner" id="jarBanner">مضاعف الجرة الخارقة! <br> <span id="jarMultText" style="font-size: 28px; color: var(--gold);">5x</span></div>
        <div class="slots-frame" id="slotsFrame"></div>
    </div>

    <!-- Win Info Banner -->
    <div class="info-panel">
        <div class="line-info" id="lineInfo">اختر الرهان واضغط ↻ للبدء</div>
        <div class="win-display">ربح <span id="winAmount">0.00</span> NSP</div>
    </div>

    <!-- Bet Selection Chips -->
    <div class="bets-container">
        <div class="bet-chip active" onclick="setBet(3, this)">3 NSP</div>
        <div class="bet-chip" onclick="setBet(6, this)">6 NSP</div>
        <div class="bet-chip" onclick="setBet(9, this)">9 NSP</div>
        <div class="bet-chip" onclick="setBet(15, this)">15 NSP</div>
        <div class="bet-chip" onclick="setBet(50, this)">50 NSP</div>
    </div>

    <!-- Action Buttons Bar -->
    <div class="controls">
        <div class="sub-btn" id="autoBtn" onclick="toggleAutoSpin()" title="دوران تلقائي">▶</div>
        <div class="sub-btn" id="speedBtn" onclick="cycleSpeed()" title="السرعة (بطيء، سريع، أسرع)">🐢</div>
        <button class="spin-btn" id="spinBtn" onclick="handleSpinButton()">↻</button>
        <div class="sub-btn" id="x2Btn" onclick="doubleBet()" title="مضاعفة الرهان">x2</div>
        <div class="sub-btn" onclick="showModal('الشحن والعملات', 'الرصيد مرتبط فوري بمحفظتك.')" title="عملات">🪙</div>
    </div>

    <!-- Bottom Stats -->
    <div class="history-bar">
        <div>🏆 أفضل ربح: <span id="bestWin" style="color: var(--gold);">0.00</span> NSP</div>
        <div>⏱️ آخر ربح: <span id="lastWin" style="color: var(--neon-blue);">0.00</span> NSP</div>
    </div>

    <!-- Navigation Footer -->
    <div class="footer-nav">
        <div class="nav-item active">
            <span>🎰</span>
            <span>اللعبة</span>
        </div>
        <div class="nav-item" onclick="showModal('لوحة الترتيب', 'أفضل اللاعبين هذا الأسبوع.')">
            <span>🏆</span>
            <span>الترتيب</span>
        </div>
        <div class="nav-item" onclick="showModal('حسابي', 'عرض تفاصيل الحساب والمعرف الشخصي.')">
            <span>👤</span>
            <span>حسابي</span>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="msg-modal">
        <div class="modal-body">
            <div id="modal-status" style="font-size: 1.15rem; font-weight: 900; color: var(--gold); margin-bottom: 8px;">تنبيه</div>
            <p id="modal-desc" style="color: #a1e5ff; font-size: 0.95rem; line-height: 1.5;"></p>
            <button class="modal-btn" onclick="closeModal()">استمرار 🚀</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        let userId = tg?.initDataUnsafe?.user?.id || 7255100997;
        let currentBet = 3;
        let isSpinning = false;
        let forceStopRequested = false;
        let currentBalance = 0.00;
        let autoSpinActive = false;
        let speedLevel = 1; // 1: بطيء, 2: سريع, 3: أسرع
        let autoInterval = null;

        const reelsCount = 5;
        const reelElements = [];
        const slotsFrame = document.getElementById('slotsFrame');

        // محرك أصوات راقي احترافي متطور (Synthesizer Audio Engine)
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playProSound(type) {
            initAudio();
            if (!audioCtx) return;
            let now = audioCtx.currentTime;

            if (type === 'click') {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.05);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.001, now + 0.05);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.05);
            } 
            else if (type === 'spin_tick') {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220 + Math.random() * 60, now);
                gain.gain.setValueAtTime(0.03, now);
                gain.gain.linearRampToValueAtTime(0.001, now + 0.03);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.03);
            }
            else if (type === 'reel_stop') {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.exponentialRampToValueAtTime(60, now + 0.08);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.linearRampToValueAtTime(0.001, now + 0.08);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.08);
            }
            else if (type === 'jar_appear') {
                // صوت ظهور الجرة السحري المميز
                [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((freq, i) => {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + (i * 0.04));
                    gain.gain.setValueAtTime(0.2, now + (i * 0.04));
                    gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.04) + 0.3);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now + (i * 0.04));
                    osc.stop(now + (i * 0.04) + 0.3);
                });
            }
            else if (type === 'jar_win') {
                // صوت ارتطام وفوز الجرة الصادم
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.5);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.linearRampToValueAtTime(0.001, now + 0.5);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.5);

                // ألحان مضاعفة الجرة
                [873.07, 1046.50, 1318.51, 1746.14].forEach((freq, i) => {
                    let o = audioCtx.createOscillator();
                    let g = audioCtx.createGain();
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(freq, now + 0.1 + (i * 0.06));
                    g.gain.setValueAtTime(0.25, now + 0.1 + (i * 0.06));
                    g.gain.exponentialRampToValueAtTime(0.001, now + 0.1 + (i * 0.06) + 0.4);
                    o.connect(g); g.connect(audioCtx.destination);
                    o.start(now + 0.1 + (i * 0.06));
                    o.stop(now + 0.1 + (i * 0.06) + 0.4);
                });
            }
            else if (type === 'win_fruit') {
                // نغمة فوز الفواكه العادية
                [523.25, 659.25, 783.99].forEach((freq, i) => {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + (i * 0.07));
                    gain.gain.setValueAtTime(0.18, now + (i * 0.07));
                    gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.07) + 0.25);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now + (i * 0.07));
                    osc.stop(now + (i * 0.07) + 0.25);
                });
            }
            else if (type === 'win_grapes') {
                // نغمة فوز العنب المضاعفة
                [659.25, 783.99, 987.77, 1174.66].forEach((freq, i) => {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + (i * 0.06));
                    gain.gain.setValueAtTime(0.22, now + (i * 0.06));
                    gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.06) + 0.35);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now + (i * 0.06));
                    osc.stop(now + (i * 0.06) + 0.35);
                });
            }
            else if (type === 'win_seven') {
                // جاكبوت السبعات
                let notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98, 2093.00];
                notes.forEach((freq, i) => {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + (i * 0.05));
                    gain.gain.setValueAtTime(0.3, now + (i * 0.05));
                    gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.05) + 0.5);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now + (i * 0.05));
                    osc.stop(now + (i * 0.05) + 0.5);
                });
            }
        }

        async function loadUserData() {
            try {
                const res = await fetch('/api/get_user_data', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: userId })
                });
                const data = await res.json();
                if (data.balance !== undefined) {
                    currentBalance = data.balance;
                    document.getElementById('u-balance').innerText = currentBalance.toFixed(2);
                    document.getElementById('u-name').innerText = data.name || "اللاعب";
                    document.getElementById('u-avatar').innerText = (data.name || "U")[0].toUpperCase();
                }
            } catch (err) {
                console.error("فشل إحضار البيانات:", err);
            }
        }
        loadUserData();

        // إنشاء البكرات
        for (let i = 0; i < reelsCount; i++) {
            const reel = document.createElement('div');
            reel.className = 'reel';
            const reelContainer = document.createElement('div');
            reelContainer.className = 'reel-container';
            reel.appendChild(reelContainer);
            slotsFrame.appendChild(reel);
            reelElements.push(reelContainer);
            fillReel(reelContainer, [generateRandomSymbolObj(false), generateRandomSymbolObj(false), generateRandomSymbolObj(false)]);
        }

        // خوارزمية توليد الرموز مع مضاعفات الجرة والندرة الحقيقية
        function generateRandomSymbolObj(allowJar = true) {
            const rand = Math.random();
            
            // الجرة نادرة الظهور جداً (0.015)
            if (allowJar && rand < 0.015) {
                let mults = [1, 1, 2, 3, 5];
                let chosenMult = mults[Math.floor(Math.random() * mults.length)];
                return { sym: '🏺', mult: chosenMult };
            }
            
            // السبعات (نادرة)
            if (rand < 0.12) return { sym: '7', mult: 1 };
            
            // العنب
            if (rand < 0.35) return { sym: '🍇', mult: 1 };

            // باقي الفواكه العامة
            const fruits = ['🍊', '🍒', '🔔'];
            return { sym: fruits[Math.floor(Math.random() * fruits.length)], mult: 1 };
        }

        function createSymbolNode(symObj) {
            const div = document.createElement('div');
            div.className = 'symbol';
            
            const badge = document.createElement('div');
            badge.className = 'symbol-badge';

            if (symObj.sym === '7') {
                div.classList.add('seven');
                badge.innerText = '7';
            } else if (symObj.sym === '🏺') {
                div.classList.add('jar-rare');
                badge.innerText = '🏺';
                
                if (symObj.mult > 1) {
                    const multTag = document.createElement('div');
                    multTag.className = 'jar-mult-tag';
                    multTag.innerText = symObj.mult + 'x';
                    badge.appendChild(multTag);
                }
            } else {
                badge.innerText = symObj.sym;
            }

            div.appendChild(badge);
            return div;
        }

        function fillReel(container, symbolsArray) {
            container.innerHTML = '';
            symbolsArray.forEach(symObj => {
                container.appendChild(createSymbolNode(symObj));
            });
        }

        function setBet(amount, el) {
            if (isSpinning) return;
            playProSound('click');
            currentBet = amount;
            document.querySelectorAll('.bet-chip').forEach(b => b.classList.remove('active'));
            if(el) el.classList.add('active');
        }

        function doubleBet() {
            playProSound('click');
            let bets = [3, 6, 9, 15, 50];
            let idx = bets.indexOf(currentBet);
            if (idx < bets.length - 1) {
                currentBet = bets[idx + 1];
            } else {
                currentBet = bets[0];
            }
            let chips = document.querySelectorAll('.bet-chip');
            chips.forEach((c, i) => {
                if(bets[i] === currentBet) {
                    chips.forEach(b => b.classList.remove('active'));
                    c.classList.add('active');
                }
            });
        }

        function toggleAutoSpin() {
            playProSound('click');
            autoSpinActive = !autoSpinActive;
            let btn = document.getElementById('autoBtn');
            if (autoSpinActive) {
                btn.classList.add('active-sub');
                startSpin();
                autoInterval = setInterval(() => {
                    if (!isSpinning) startSpin();
                }, 1800);
            } else {
                btn.classList.remove('active-sub');
                clearInterval(autoInterval);
            }
        }

        function cycleSpeed() {
            playProSound('click');
            speedLevel = (speedLevel % 3) + 1;
            let btn = document.getElementById('speedBtn');
            if (speedLevel === 1) {
                btn.innerText = '🐢';
                btn.title = 'بطيء';
            } else if (speedLevel === 2) {
                btn.innerText = '🚀';
                btn.title = 'سريع';
            } else {
                btn.innerText = '⚡';
                btn.title = 'أسرع';
            }
        }

        function handleSpinButton() {
            if (isSpinning) {
                forceStopRequested = true;
            } else {
                startSpin();
            }
        }

        async function startSpin() {
            if (isSpinning) return;
            if (currentBalance < currentBet) {
                showModal("❌ رصيد غير كافٍ", "يرجى شحن حسابك للبدء.");
                if (autoSpinActive) toggleAutoSpin();
                return;
            }

            isSpinning = true;
            forceStopRequested = false;
            document.getElementById('spinBtn').innerText = '⏹️';
            clearCanvas();
            hideJarBanner();
            document.getElementById('lineInfo').innerText = 'جاري التدوير...';
            document.getElementById('winAmount').innerText = '0.00';

            let serverResponse = null;
            try {
                const res = await fetch('/api/play_game', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: userId, bet: currentBet, game: 'golden_tree' })
                });
                serverResponse = await res.json();
            } catch (e) {
                console.warn("تنبيه اتصال السيرفر", e);
            }

            let finalGrid = [];
            let baseSpeed = speedLevel === 1 ? 1100 : (speedLevel === 2 ? 550 : 200);
            let jarAppearedInSpin = false;

            const spinPromises = reelElements.map((reelContainer, index) => {
                return new Promise(resolve => {
                    setTimeout(() => {
                        reelContainer.classList.add('blur-spin');
                        let interval = setInterval(() => {
                            playProSound('spin_tick');
                            fillReel(reelContainer, [generateRandomSymbolObj(false), generateRandomSymbolObj(false), generateRandomSymbolObj(false)]);
                        }, forceStopRequested ? 10 : 35);

                        let currentWait = forceStopRequested ? 40 : (baseSpeed + index * 100);

                        setTimeout(() => {
                            clearInterval(interval);
                            reelContainer.classList.remove('blur-spin');
                            
                            let finalSyms = [generateRandomSymbolObj(true), generateRandomSymbolObj(false), generateRandomSymbolObj(false)];
                            
                            // فحص ظهور الجرة وإصدار صوت الظهور الخاص
                            if (finalSyms.some(s => s.sym === '🏺')) {
                                jarAppearedInSpin = true;
                                playProSound('jar_appear');
                            } else {
                                playProSound('reel_stop');
                            }

                            fillReel(reelContainer, finalSyms);
                            finalGrid.push(finalSyms);
                            resolve();
                        }, currentWait);
                    }, forceStopRequested ? 0 : index * 30);
                });
            });

            await Promise.all(spinPromises);

            if (serverResponse && serverResponse.new_balance !== undefined) {
                currentBalance = serverResponse.new_balance;
                document.getElementById('u-balance').innerText = currentBalance.toFixed(2);
            }

            // تقييم الربح الصارم
            evaluateStrictPaylines(finalGrid, serverResponse);
            isSpinning = false;
            forceStopRequested = false;
            document.getElementById('spinBtn').innerText = '↻';
        }

        // خوارزمية الربح الصارمة جداً المطابقة للشروط الحرفية
        function evaluateStrictPaylines(grid, serverResponse) {
            // تحويل الشبكة إلى صفوف أفقية
            let rows = [0, 1, 2].map(r => grid.map(reel => reel[r]));
            let totalMultiplier = 0;
            let matchedLines = [];
            let maxJarMultFound = 1;
            let isJarInWin = false;
            let winningSymbolType = 'fruit';

            // مسارات Paylines الصارمة (من اليسار إلى اليمين عبر 5 بكرات)
            let lineConfigs = [
                { id: 'H1', name: 'أفقي علوي', path: [rows[0][0], rows[0][1], rows[0][2], rows[0][3], rows[0][4]], coords: [[0,0],[1,0],[2,0],[3,0],[4,0]] },
                { id: 'H2', name: 'أفقي أوسط', path: [rows[1][0], rows[1][1], rows[1][2], rows[1][3], rows[1][4]], coords: [[0,1],[1,1],[2,1],[3,1],[4,1]] },
                { id: 'H3', name: 'أفقي سفلي', path: [rows[2][0], rows[2][1], rows[2][2], rows[2][3], rows[2][4]], coords: [[0,2],[1,2],[2,2],[3,2],[4,2]] },
                { id: 'D1', name: 'مائل للأسفل', path: [rows[0][0], rows[1][1], rows[2][2], rows[1][3], rows[0][4]], coords: [[0,0],[1,1],[2,2],[3,1],[4,0]] },
                { id: 'D2', name: 'مائل للأعلى', path: [rows[2][0], rows[1][1], rows[0][2], rows[1][3], rows[2][4]], coords: [[0,2],[1,1],[2,0],[3,1],[4,2]] }
            ];

            lineConfigs.forEach((cfg) => {
                let lineSymbols = cfg.path;
                let firstObj = lineSymbols[0];

                // يجب تبدأ السلسلة من البكرة 0 من اليسار
                if (!firstObj) return;

                let baseSym = firstObj.sym;
                let count = 0;
                let lineJarMult = 1;

                // إذا كانت الأولى جرة، نعتبرها Wild
                if (baseSym === '🏺') {
                    isJarInWin = true;
                    if (firstObj.mult > lineJarMult) lineJarMult = firstObj.mult;
                    // البحث عن أول رمز حقيقي بعد الجرة
                    for(let k=1; k<lineSymbols.length; k++) {
                        if(lineSymbols[k].sym !== '🏺') {
                            baseSym = lineSymbols[k].sym;
                            break;
                        }
                    }
                }

                if (!baseSym || baseSym === '🏺') return; // جميعها جرات بدون رمز

                // حساب التتابع الصارم من اليسار إلى اليمين
                for (let i = 0; i < lineSymbols.length; i++) {
                    let item = lineSymbols[i];
                    if (item.sym === baseSym || item.sym === '🏺') {
                        count++;
                        if (item.sym === '🏺') {
                            isJarInWin = true;
                            if (item.mult > lineJarMult) lineJarMult = item.mult;
                        }
                    } else {
                        break; // انقطاع السلسلة فوراً
                    }
                }

                let lineBaseMult = 0;

                // الفواكه العامة (🍊, 🍒, 🔔)
                if (['🍊', '🍒', '🔔'].includes(baseSym)) {
                    if (count === 3) lineBaseMult = 1;
                    else if (count === 4) lineBaseMult = 2;
                    else if (count >= 5) lineBaseMult = 5;
                }
                // العنب (🍇)
                else if (baseSym === '🍇') {
                    if (count === 3) lineBaseMult = 2;
                    else if (count === 4) lineBaseMult = 3;
                    else if (count >= 5) lineBaseMult = 10;
                    if (lineBaseMult > 0) winningSymbolType = 'grapes';
                }
                // السبعات (7)
                else if (baseSym === '7') {
                    if (count === 2) lineBaseMult = 2;
                    else if (count === 3) lineBaseMult = 3;
                    else if (count === 4) lineBaseMult = 5;
                    else if (count >= 5) lineBaseMult = 20;
                    if (lineBaseMult > 0) winningSymbolType = 'seven';
                }

                if (lineBaseMult > 0) {
                    let lineTotal = lineBaseMult * lineJarMult;
                    totalMultiplier += lineTotal;
                    if (lineJarMult > maxJarMultFound) maxJarMultFound = lineJarMult;
                    matchedLines.push({ config: cfg, count, coords: cfg.coords.slice(0, count) });
                }
            });

            let finalWinAmount = 0;
            if (serverResponse && serverResponse.win) {
                finalWinAmount = serverResponse.win_amount;
            } else {
                finalWinAmount = totalMultiplier * currentBet;
            }

            if (finalWinAmount > 0) {
                // إيقاف وتفعيل صوت الجرة الخاص إذا كانت مشاركة في الربح
                if (isJarInWin) {
                    playProSound('jar_win');
                    triggerScreenShake();
                    showJarBanner(maxJarMultFound);
                } else if (winningSymbolType === 'seven') {
                    playProSound('win_seven');
                } else if (winningSymbolType === 'grapes') {
                    playProSound('win_grapes');
                } else {
                    playProSound('win_fruit');
                }

                document.getElementById('winAmount').innerText = finalWinAmount.toFixed(2);
                document.getElementById('lineInfo').innerText = `مبروك! ربحت ${finalWinAmount.toFixed(2)} NSP`;
                document.getElementById('lastWin').innerText = finalWinAmount.toFixed(2);

                let best = parseFloat(document.getElementById('bestWin').innerText);
                if (finalWinAmount > best) document.getElementById('bestWin').innerText = finalWinAmount.toFixed(2);

                confetti({ particleCount: 180, spread: 120, origin: { y: 0.6 } });
                drawWinningLines(matchedLines);
                highlightWinningSymbols(matchedLines);
            } else {
                document.getElementById('winAmount').innerText = '0.00';
                document.getElementById('lineInfo').innerText = 'حظ أوفر في الضربة القادمة';
                clearCanvas();
            }
        }

        function triggerScreenShake() {
            slotsFrame.classList.add('shake');
            setTimeout(() => slotsFrame.classList.remove('shake'), 500);
        }

        function showJarBanner(mult) {
            const banner = document.getElementById('jarBanner');
            document.getElementById('jarMultText').innerText = mult + 'x';
            banner.classList.add('show');
            setTimeout(() => banner.classList.remove('show'), 2200);
        }

        function hideJarBanner() {
            document.getElementById('jarBanner').classList.remove('show');
        }

        function highlightWinningSymbols(lines) {
            lines.forEach(l => {
                l.coords.forEach(([reelIdx, rowIdx]) => {
                    let reelObj = reelElements[reelIdx];
                    let symbolNode = reelObj.children[rowIdx];
                    if (symbolNode) symbolNode.classList.add('win-pop');
                });
            });
        }

        // رسم خطوط نيون فائقة الدقة والجمال
        function drawWinningLines(lines) {
            const canvas = document.getElementById('lineCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            let colWidth = canvas.width / 5;
            let rowHeight = canvas.height / 3;

            lines.forEach(l => {
                ctx.beginPath();
                l.coords.forEach(([c, r], index) => {
                    let x = (c * colWidth) + (colWidth / 2);
                    let y = (r * rowHeight) + (rowHeight / 2);
                    if (index === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });

                ctx.strokeStyle = '#ffdf00';
                ctx.lineWidth = 6;
                ctx.shadowColor = '#ffdf00';
                ctx.shadowBlur = 20;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
            });
        }

        function clearCanvas() {
            const canvas = document.getElementById('lineCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.querySelectorAll('.symbol').forEach(s => s.classList.remove('win-pop'));
        }

        function showModal(title, desc) {
            playProSound('click');
            document.getElementById('modal-status').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('msg-modal').style.display = 'flex';
        }

        function closeModal() {
            playProSound('click');
            document.getElementById('msg-modal').style.display = 'none';
        }
    </script>
