<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Golden Bull Slot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --gold: #ffd700;
            --gold-glow: #ffaa00;
            --bg-dark: #0a0303;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .slot-container {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(145deg, #2a0a0a, #120303);
            border: 3px solid var(--gold);
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.25);
        }

        .header {
            font-size: 24px;
            font-weight: 900;
            color: var(--gold);
            text-shadow: 0 0 10px var(--gold-glow);
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .balance-board {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--gold);
            border-radius: 10px;
            padding: 8px 15px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }

        .balance-amount {
            color: #2ecc71;
            font-size: 18px;
        }

        .reels-frame {
            display: flex;
            justify-content: space-between;
            background: #000;
            border: 2px solid var(--gold);
            border-radius: 12px;
            padding: 5px;
            gap: 4px;
            position: relative;
            overflow: hidden;
        }

        .win-line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: rgba(255, 215, 0, 0.6);
            box-shadow: 0 0 8px var(--gold);
            z-index: 10;
            pointer-events: none;
        }

        .reel-window {
            width: 19%;
            height: 210px; /* 3 رموز × 70px */
            background: linear-gradient(180deg, #111 0%, #222 50%, #111 100%);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 215, 0, 0.2);
            position: relative;
        }

        .reel-strip {
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
        }

        .symbol-item {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
        }

        .controls {
            margin-top: 15px;
        }

        .bet-selector {
            display: flex;
            justify-content: space-between;
            gap: 5px;
            margin-bottom: 15px;
        }

        .bet-btn {
            flex: 1;
            background: rgba(0, 0, 0, 0.6);
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 8px 0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        .bet-btn.active {
            background: var(--gold);
            color: #000;
            box-shadow: 0 0 8px var(--gold);
        }

        .spin-btn {
            width: 100%;
            padding: 14px;
            font-size: 20px;
            font-weight: 900;
            background: linear-gradient(180deg, #ffd700, #ff8c00);
            color: #000;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 140, 0, 0.4);
        }

        .spin-btn:disabled {
            background: #444;
            color: #888;
            box-shadow: none;
        }

        .result-box {
            margin-top: 12px;
            min-height: 24px;
            font-size: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="slot-container">
    <div class="header">GOLDEN BULL</div>

    <div class="balance-board">
        <span>الرصيد:</span>
        <span class="balance-amount" id="balance">10,000</span> NSP
    </div>

    <div class="reels-frame">
        <div class="win-line"></div>
        <div class="reel-window"><div class="reel-strip" id="strip-0"></div></div>
        <div class="reel-window"><div class="reel-strip" id="strip-1"></div></div>
        <div class="reel-window"><div class="reel-strip" id="strip-2"></div></div>
        <div class="reel-window"><div class="reel-strip" id="strip-3"></div></div>
        <div class="reel-window"><div class="reel-strip" id="strip-4"></div></div>
    </div>

    <div class="controls">
        <div class="bet-selector">
            <button class="bet-btn active" onclick="selectBet(100, this)">100</button>
            <button class="bet-btn" onclick="selectBet(500, this)">500</button>
            <button class="bet-btn" onclick="selectBet(1000, this)">1000</button>
            <button class="bet-btn" onclick="selectBet(2000, this)">2000</button>
        </div>
        <button class="spin-btn" id="spinBtn" onclick="spin()">دوران 🎰</button>
    </div>

    <div class="result-box" id="result">اختر الرهان واضغط دوران!</div>
</div>

<script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    // قراءة نمط الخوارزمية من الرابط السري القادم من البوت
    const urlParams = new URLSearchParams(window.location.search);
    const algoMode = urlParams.get('mode') || 'normal';

    const FRUITS = ['🍋', '🍒', '🍇', '🍉', '🍓', '🍍', '🍎'];
    const SYMBOL_HEIGHT = 70;
    
    let userBalance = 10000;
    let currentBet = 100;
    let isSpinning = false;

    const initialBoard = [
        ['🍋', '🍒', '🍇'],
        ['🍉', '🍓', '🍍'],
        ['🍎', '🍋', '🍒'],
        ['🍇', '🍉', '🍓'],
        ['🍍', '🍎', '🍋']
    ];

    function initReels() {
        for (let r = 0; r < 5; r++) {
            const strip = document.getElementById(`strip-${r}`);
            strip.innerHTML = '';
            initialBoard[r].forEach(sym => {
                const item = document.createElement('div');
                item.className = 'symbol-item';
                item.innerText = sym;
                strip.appendChild(item);
            });
        }
    }

    function selectBet(amount, btn) {
        if (isSpinning) return;
        currentBet = amount;
        document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function getRandomFruit() {
        return FRUITS[Math.floor(Math.random() * FRUITS.length)];
    }

    function generateOutcome() {
        let targetRow = 1; 
        let outcome = [[], [], [], [], []];
        let matchCount = 0;

        if (algoMode === 'loss') {
            matchCount = 0; // خسارة دائمية
        } else if (algoMode === 'normal') {
            matchCount = 3; // ربح سعر الرهان فقط (1x)
        } else if (algoMode === 'medium') {
            matchCount = Math.random() < 0.5 ? 3 : 4; // تنوع بين 1x و 2x
        } else if (algoMode === 'high') {
            const rand = Math.random();
            if (rand < 0.4) matchCount = 5;      // 10 أضعاف
            else if (rand < 0.7) matchCount = 4; // ضعف الرهان
            else matchCount = 3;                 // نفس الرهان
        }

        if (matchCount >= 3) {
            const chosen = getRandomFruit();
            const startCol = Math.floor(Math.random() * (6 - matchCount));

            for (let c = 0; c < 5; c++) {
                for (let r = 0; r < 3; r++) {
                    if (r === targetRow && c >= startCol && c < startCol + matchCount) {
                        outcome[c][r] = chosen;
                    } else {
                        outcome[c][r] = getRandomFruit();
                    }
                }
            }
        } else {
            for (let c = 0; c < 5; c++) {
                for (let r = 0; r < 3; r++) {
                    outcome[c][r] = getRandomFruit();
                }
            }
            for (let c = 2; c < 5; c++) {
                if (outcome[c][1] === outcome[c-1][1] && outcome[c-1][1] === outcome[c-2][1]) {
                    outcome[c][1] = (FRUITS.indexOf(outcome[c][1]) + 1) % FRUITS.length;
                }
            }
        }

        return outcome;
    }

    function calculateWin(board) {
        const midRow = [board[0][1], board[1][1], board[2][1], board[3][1], board[4][1]];
        let maxMatch = 1;
        let currentMatch = 1;

        for (let i = 1; i < midRow.length; i++) {
            if (midRow[i] === midRow[i - 1]) {
                currentMatch++;
                if (currentMatch > maxMatch) maxMatch = currentMatch;
            } else {
                currentMatch = 1;
            }
        }

        if (maxMatch === 5) return { multiplier: 10, msg: 'خماسية ذهبية! 🏆 (10 أضعاف)' };
        if (maxMatch === 4) return { multiplier: 2, msg: 'رباعية متتالية! 🎉 (ضعف الرهان)' };
        if (maxMatch === 3) return { multiplier: 1, msg: 'ثلاثية متطابقة! ✨ (نفس الرهان)' };
        return { multiplier: 0, msg: 'حظاً أوفر!' };
    }

    async function spin() {
        if (isSpinning) return;
        if (userBalance < currentBet) {
            document.getElementById('result').innerText = "❌ رصيدك غير كافٍ!";
            document.getElementById('result').style.color = "#e74c3c";
            return;
        }

        isSpinning = true;
        userBalance -= currentBet;
        document.getElementById('balance').innerText = userBalance.toLocaleString();
        document.getElementById('spinBtn').disabled = true;
        document.getElementById('result').innerText = "⚡ جاري الدوران...";
        document.getElementById('result').style.color = "#fff";

        const nextBoard = generateOutcome();

        const spinPromises = [];
        for (let r = 0; r < 5; r++) {
            spinPromises.push(animateReel(r, nextBoard[r], r * 120));
        }

        await Promise.all(spinPromises);

        const result = calculateWin(nextBoard);
        const winAmount = currentBet * result.multiplier;

        if (winAmount > 0) {
            userBalance += winAmount;
            document.getElementById('result').innerText = `ربحت ${winAmount.toLocaleString()} NSP - ${result.msg}`;
            document.getElementById('result').style.color = "#2ecc71";
        } else {
            document.getElementById('result').innerText = "خسارة! حظاً أوفر المرة القادمة.";
            document.getElementById('result').style.color = "#e74c3c";
        }

        document.getElementById('balance').innerText = userBalance.toLocaleString();
        isSpinning = false;
        document.getElementById('spinBtn').disabled = false;

        if (tg) {
            tg.sendData(JSON.stringify({
                action: "spin_result",
                bet: currentBet,
                win: winAmount,
                new_balance: userBalance
            }));
        }
    }

    function animateReel(reelIndex, targetSymbols, delay) {
        return new Promise(resolve => {
            setTimeout(() => {
                const strip = document.getElementById(`strip-${reelIndex}`);
                const spinCount = 18;
                let stripHTML = '';
                
                strip.querySelectorAll('.symbol-item').forEach(el => {
                    stripHTML += `<div class="symbol-item">${el.innerText}</div>`;
                });

                for (let i = 0; i < spinCount; i++) {
                    stripHTML += `<div class="symbol-item">${getRandomFruit()}</div>`;
                }

                targetSymbols.forEach(sym => {
                    stripHTML += `<div class="symbol-item">${sym}</div>`;
                });

                strip.innerHTML = stripHTML;

                const totalItems = strip.children.length;
                const targetY = -((totalItems - 3) * SYMBOL_HEIGHT);

                strip.style.transition = 'none';
                strip.style.transform = 'translateY(0px)';

                setTimeout(() => {
                    strip.style.transition = 'transform 1s cubic-bezier(0.15, 0.85, 0.15, 1)';
                    strip.style.transform = `translateY(${targetY}px)`;
                }, 20);

                setTimeout(() => {
                    strip.style.transition = 'none';
                    strip.innerHTML = '';
                    targetSymbols.forEach(sym => {
                        const item = document.createElement('div');
                        item.className = 'symbol-item';
                        item.innerText = sym;
                        strip.appendChild(item);
                    });
                    strip.style.transform = 'translateY(0px)';
                    resolve();
                }, 1050);

            }, delay);
        });
    }

    initReels();
</script>

</body>
</html>
