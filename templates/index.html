<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>goold Lera - VIP Slot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-glow: rgba(0, 210, 255, 0.6);
            --gold: #ffd700;
            --orange: #ff8800;
            --bg-dark: #030d18;
            --card-bg: rgba(3, 20, 40, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at center, #0a233c 0%, var(--bg-dark) 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        /* Top Bar & User Header */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: rgba(1, 15, 30, 0.9);
            border-bottom: 1px solid rgba(0, 210, 255, 0.3);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--orange));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #000;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .logo {
            text-align: center;
            font-size: 22px;
            font-weight: 900;
            background: linear-gradient(180deg, #fff 0%, #ffd700 50%, #b38f00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
            line-height: 1;
        }

        .balance-badge {
            background: rgba(0, 210, 255, 0.1);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 10px var(--neon-glow);
        }

        /* Top Mini Widgets matching Gold Lera Image */
        .top-widgets {
            display: flex;
            justify-content: space-between;
            padding: 6px 16px;
        }

        .mini-badge {
            border: 1px solid var(--neon-blue);
            border-radius: 16px;
            padding: 4px 10px;
            font-size: 10px;
            background: rgba(0,30,60,0.6);
            color: var(--neon-blue);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 8px var(--neon-glow);
        }

        /* Game Slots Grid Frame */
        .game-container {
            position: relative;
            width: 94%;
            max-width: 420px;
            margin: 4px auto 0;
        }

        .slots-frame {
            display: flex;
            gap: 4px;
            background: rgba(1, 15, 30, 0.95);
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 22px var(--neon-glow), inset 0 0 15px var(--neon-glow);
            border-radius: 12px;
            padding: 6px;
            position: relative;
            overflow: hidden;
        }

        .reel {
            flex: 1;
            height: 240px;
            background: var(--card-bg);
            border: 1px solid rgba(0, 210, 255, 0.4);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .reel-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
        }

        .symbol {
            height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 38px;
            position: relative;
        }

        .symbol.wild {
            background: radial-gradient(circle, rgba(255,215,0,0.3) 0%, transparent 75%);
            border: 1px solid var(--gold);
            box-shadow: inset 0 0 15px var(--gold);
            border-radius: 6px;
        }

        .symbol.wild-text {
            font-size: 10px;
            font-weight: 900;
            color: var(--gold);
            text-shadow: 0 0 6px var(--gold);
            margin-top: -4px;
            letter-spacing: 1px;
        }

        .symbol.seven {
            color: #00f0ff;
            text-shadow: 0 0 12px #00f0ff, 0 0 22px #00d2ff;
            font-weight: 900;
            font-style: italic;
        }

        #lineCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Win & Stats Info Display */
        .info-panel {
            text-align: center;
            margin: 6px 0;
        }

        .line-info {
            color: var(--neon-blue);
            font-size: 13px;
            font-weight: 700;
        }

        .win-display {
            font-size: 22px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 12px var(--neon-blue);
        }

        /* Bet Selector */
        .bets-container {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 8px;
            padding: 0 10px;
        }

        .bet-chip {
            padding: 6px 10px;
            border-radius: 18px;
            border: 1px solid var(--neon-blue);
            background: rgba(0, 30, 60, 0.7);
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 6px var(--neon-glow);
            transition: all 0.2s;
        }

        .bet-chip.active {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 15px var(--neon-blue);
            font-weight: 900;
        }

        /* Controls Bar */
        .controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 16px;
            margin-bottom: 8px;
        }

        .spin-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 3px solid var(--neon-blue);
            background: radial-gradient(circle, rgba(0,210,255,0.45) 0%, rgba(0,30,60,0.95) 100%);
            box-shadow: 0 0 20px var(--neon-blue), inset 0 0 15px var(--neon-blue);
            color: #fff;
            font-size: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .spin-btn:active {
            transform: scale(0.92);
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .sub-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--neon-blue);
            background: rgba(0, 20, 40, 0.75);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 0 5px var(--neon-glow);
        }

        /* Footer Stats */
        .history-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 15, 30, 0.9);
            border-top: 1px solid rgba(0, 210, 255, 0.3);
            border-bottom: 1px solid rgba(0, 210, 255, 0.3);
            padding: 6px 0;
            font-size: 11px;
            font-weight: bold;
        }

        /* Navigation Footer matching image names exactly */
        .footer-nav {
            display: flex;
            justify-content: space-around;
            background: #020810;
            padding: 8px 0;
            border-top: 1px solid rgba(0,210,255,0.2);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-size: 11px;
            color: #5d7a97;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--neon-blue);
            text-shadow: 0 0 8px var(--neon-blue);
        }

        .blur-spin {
            filter: blur(4px);
        }

        /* Dialog Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-body {
            background: #091a2e;
            border-radius: 20px;
            border: 1px solid var(--neon-blue);
            padding: 24px;
            text-align: center;
            max-width: 320px;
            width: 100%;
            box-shadow: 0 0 25px var(--neon-glow);
        }

        .modal-btn {
            background: var(--neon-blue);
            color: #000;
            border: none;
            padding: 10px 25px;
            border-radius: 12px;
            font-weight: 900;
            margin-top: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Header Section matching Gold Lera -->
    <div class="top-bar">
        <div class="user-info">
            <div class="avatar" id="u-avatar">U</div>
            <span id="u-name" style="font-weight: bold; font-size: 0.85rem;">اللاعب</span>
        </div>
        <div class="logo">goold<br><span style="font-size: 14px; color: #a1e5ff;">Lera</span></div>
        <div class="balance-badge">
            <span id="u-balance">0.00</span>
            <span style="font-size: 11px;">NSP</span>
        </div>
    </div>

    <!-- Top Mini Widgets (DD, HH, المهام) -->
    <div class="top-widgets">
        <div class="mini-badge">
            <span>⚡ 3 3 3</span>
            <span style="font-size: 8px; color: #8cf;">DD HH</span>
        </div>
        <div class="mini-badge" style="border-color: var(--gold); color: var(--gold);">
            <span>🎁 المهام</span>
        </div>
        <div class="mini-badge">
            <span>🔲 خيارات</span>
        </div>
    </div>

    <!-- Main Game Board -->
    <div class="game-container">
        <canvas id="lineCanvas"></canvas>
        <div class="slots-frame" id="slotsFrame"></div>
    </div>

    <!-- Win Info Banner -->
    <div class="info-panel">
        <div class="line-info" id="lineInfo">اختر الرهان واضغط ↻ للبدء</div>
        <div class="win-display">ربح <span id="winAmount">0.00</span> NSP</div>
    </div>

    <!-- Bet Selection Chips (3, 6, 9, 15, 50) -->
    <div class="bets-container">
        <div class="bet-chip active" onclick="setBet(3, this)">3 NSP</div>
        <div class="bet-chip" onclick="setBet(6, this)">6 NSP</div>
        <div class="bet-chip" onclick="setBet(9, this)">9 NSP</div>
        <div class="bet-chip" onclick="setBet(15, this)">15 NSP</div>
        <div class="bet-chip" onclick="setBet(50, this)">50 NSP</div>
    </div>

    <!-- Action Buttons Bar -->
    <div class="controls">
        <div class="sub-btn">▶</div>
        <div class="sub-btn">⚡</div>
        <button class="spin-btn" id="spinBtn" onclick="startSpin()">↻</button>
        <div class="sub-btn">x2</div>
        <div class="sub-btn">🪙</div>
    </div>

    <!-- Bottom Stats -->
    <div class="history-bar">
        <div>🏆 أفضل ربح: <span id="bestWin" style="color: var(--gold);">0.00</span> NSP</div>
        <div>⏱️ آخر ربح: <span id="lastWin" style="color: var(--neon-blue);">0.00</span> NSP</div>
    </div>

    <!-- Navigation Footer (Strictly named matching image: اللعبة، الترتيب، حسابي) -->
    <div class="footer-nav">
        <div class="nav-item active">
            <span>🎰</span>
            <span>اللعبة</span>
        </div>
        <div class="nav-item">
            <span>🏆</span>
            <span>الترتيب</span>
        </div>
        <div class="nav-item">
            <span>👤</span>
            <span>حسابي</span>
        </div>
    </div>

    <!-- System Modal Alert -->
    <div class="modal" id="msg-modal">
        <div class="modal-body">
            <div id="modal-status" style="font-size: 1.2rem; font-weight: 900; color: var(--gold); margin-bottom: 6px;">تنبيه</div>
            <p id="modal-desc" style="color: #a1e5ff; font-size: 0.9rem;"></p>
            <button class="modal-btn" onclick="closeModal()">استمرار 🚀</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        let userId = tg?.initDataUnsafe?.user?.id || 7255100997;
        let currentBet = 3;
        let isSpinning = false;
        let currentBalance = 0.00;

        const SYMBOLS = ['7', '🍊', '🍇', '🍒', '🔔', '🏺'];
        const WILD_SYMBOL = '🏺'; // الجرة الذهبية النادرة
        const reelsCount = 5;
        const reelElements = [];
        const slotsFrame = document.getElementById('slotsFrame');

        // Web Audio API for Professional Sound Effects
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSpinSound() {
            initAudio();
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playWinSound() {
            initAudio();
            if (!audioCtx) return;
            let now = audioCtx.currentTime;
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.frequency.setValueAtTime(freq, now + i * 0.08);
                gain.gain.setValueAtTime(0.2, now + i * 0.08);
                gain.gain.linearRampToValueAtTime(0.01, now + i * 0.08 + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + i * 0.08);
                osc.stop(now + i * 0.08 + 0.2);
            });
        }

        // Fetch User Data from Python Server
        async function loadUserData() {
            try {
                const res = await fetch('/api/get_user_data', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: userId })
                });
                const data = await res.json();
                if (data.balance !== undefined) {
                    currentBalance = data.balance;
                    document.getElementById('u-balance').innerText = currentBalance.toFixed(2);
                    document.getElementById('u-name').innerText = data.name || "اللاعب";
                    document.getElementById('u-avatar').innerText = (data.name || "U")[0].toUpperCase();
                }
            } catch (err) {
                console.error("فشل إحضار بيانات المستخدم:", err);
            }
        }
        loadUserData();

        // Build 5 Slot Reels
        for (let i = 0; i < reelsCount; i++) {
            const reel = document.createElement('div');
            reel.className = 'reel';
            const reelContainer = document.createElement('div');
            reelContainer.className = 'reel-container';
            reel.appendChild(reelContainer);
            slotsFrame.appendChild(reel);
            reelElements.push(reelContainer);

            fillReel(reelContainer, [getRandomSymbol(), getRandomSymbol(), getRandomSymbol()]);
        }

        // Jar (WILD) restricted to rare appearance (Max 3 on screen)
        function getRandomSymbol() {
            const rand = Math.random();
            if (rand < 0.08) return '🏺'; // نادرة الظهور
            if (rand < 0.30) return '7';
            return SYMBOLS[Math.floor(Math.random() * 4) + 1];
        }

        function createSymbolNode(sym) {
            const div = document.createElement('div');
            div.className = 'symbol';
            if (sym === '7') {
                div.classList.add('seven');
                div.innerHTML = '7';
            } else if (sym === '🏺') {
                div.classList.add('wild');
                div.innerHTML = '🏺<div class="wild-text">WILD</div>';
            } else {
                div.innerHTML = sym;
            }
            return div;
        }

        function fillReel(container, symbolsArray) {
            container.innerHTML = '';
            symbolsArray.forEach(sym => {
                container.appendChild(createSymbolNode(sym));
            });
        }

        function setBet(amount, el) {
            if (isSpinning) return;
            currentBet = amount;
            document.querySelectorAll('.bet-chip').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        async function startSpin() {
            if (isSpinning) return;
            if (currentBalance < currentBet) {
                showModal("❌ رصيد غير كافٍ", "يرجى شحن حسابك في البوت للبدء بهذه الدورة.");
                return;
            }

            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            clearCanvas();
            document.getElementById('lineInfo').innerText = 'جاري التدوير...';
            document.getElementById('winAmount').innerText = '0.00';

            let serverResponse = null;

            try {
                const res = await fetch('/api/play_game', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: userId, bet: currentBet, game: 'goold_lera' })
                });
                serverResponse = await res.json();
            } catch (e) {
                console.warn("تنبيه الاتصال بالسيرفر", e);
            }

            // Spin Animation from Left to Right with Sound
            let finalGrid = [];
            let jarCount = 0;

            const spinPromises = reelElements.map((reelContainer, index) => {
                return new Promise(resolve => {
                    setTimeout(() => {
                        reelContainer.classList.add('blur-spin');
                        let interval = setInterval(() => {
                            playSpinSound();
                            fillReel(reelContainer, [getRandomSymbol(), getRandomSymbol(), getRandomSymbol()]);
                        }, 50);

                        setTimeout(() => {
                            clearInterval(interval);
                            reelContainer.classList.remove('blur-spin');
                            
                            let finalSyms = [getRandomSymbol(), getRandomSymbol(), getRandomSymbol()];
                            
                            // Ensure Jar (WILD) does not exceed 3 total on screen
                            finalSyms = finalSyms.map(s => {
                                if (s === '🏺') {
                                    if (jarCount < 3) {
                                        jarCount++;
                                        return '🏺';
                                    } else {
                                        return '7';
                                    }
                                }
                                return s;
                            });

                            fillReel(reelContainer, finalSyms);
                            finalGrid.push(finalSyms);
                            resolve();
                        }, 800 + index * 200);
                    }, index * 60);
                });
            });

            await Promise.all(spinPromises);

            if (serverResponse && serverResponse.new_balance !== undefined) {
                currentBalance = serverResponse.new_balance;
                document.getElementById('u-balance').innerText = currentBalance.toFixed(2);
            }

            evaluateWin(finalGrid, serverResponse);
            isSpinning = false;
            document.getElementById('spinBtn').disabled = false;
        }

        // Win Logic: Left to Right Single Lines (Max multiplier capped at 100x)
        function evaluateWin(grid, serverResponse) {
            let rows = [0, 1, 2].map(r => grid.map(reel => reel[r]));
            let totalMultiplier = 0;
            let winningLines = [];

            rows.forEach((rowSyms, rowIndex) => {
                let firstSym = rowSyms[0];
                let matchCount = 1;

                let baseSym = firstSym === WILD_SYMBOL ? rowSyms.find(s => s !== WILD_SYMBOL) || '7' : firstSym;

                for (let c = 1; c < rowSyms.length; c++) {
                    if (rowSyms[c] === baseSym || rowSyms[c] === WILD_SYMBOL) {
                        matchCount++;
                    } else {
                        break;
                    }
                }

                let mult = 0;
                if (baseSym === '7') {
                    if (matchCount === 2) mult = 1;
                    else if (matchCount === 3) mult = 2;
                    else if (matchCount === 4) mult = 5;
                    else if (matchCount === 5) mult = 100; // الحد الأقصى للربح الضخم 100x
                } else { 
                    if (matchCount === 3) mult = 1;
                    else if (matchCount === 4) mult = 5;
                    else if (matchCount === 5) mult = 10;
                }

                if (mult > 0) {
                    if (mult > 100) mult = 100; // منع تجاوز 100x تماماً
                    totalMultiplier += mult;
                    winningLines.push({ row: rowIndex, mult });
                }
            });

            let winAmount = serverResponse?.win_amount !== undefined ? serverResponse.win_amount : (totalMultiplier * currentBet);

            if (winAmount > 0) {
                playWinSound();
                document.getElementById('winAmount').innerText = winAmount.toFixed(2);
                document.getElementById('lineInfo').innerText = `مبروك! ربحت ${winAmount.toFixed(2)} NSP`;
                document.getElementById('lastWin').innerText = winAmount.toFixed(2);

                let currentBest = parseFloat(document.getElementById('bestWin').innerText);
                if (winAmount > currentBest) {
                    document.getElementById('bestWin').innerText = winAmount.toFixed(2);
                }

                confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
                drawSingleLine(winningLines);
            } else {
                document.getElementById('lineInfo').innerText = 'حظ أوفر في الضربة القادمة';
            }
        }

        // Draw Single Line instead of full box lines
        function drawSingleLine(lines) {
            const canvas = document.getElementById('lineCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            lines.forEach(line => {
                const y = (line.row * 80) + 40;
                ctx.beginPath();
                ctx.moveTo(12, y);
                ctx.lineTo(canvas.width - 12, y);
                ctx.strokeStyle = '#00f0ff';
                ctx.lineWidth = 3;
                ctx.shadowColor = '#00f0ff';
                ctx.shadowBlur = 10;
                ctx.stroke();
            });
        }

        function clearCanvas() {
            const canvas = document.getElementById('lineCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function showModal(title, desc) {
            document.getElementById('modal-status').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('msg-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('msg-modal').style.display = 'none';
        }
    </script>
</body>
</html>
