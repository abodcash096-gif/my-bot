<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>goold Lera - VIP Slot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-glow: rgba(0, 210, 255, 0.6);
            --gold: #ffd700;
            --orange: #ff8800;
            --bg-dark: #030d18;
            --card-bg: rgba(3, 20, 40, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at center, #0a233c 0%, var(--bg-dark) 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background: rgba(1, 15, 30, 0.95);
            border-bottom: 1px solid rgba(0, 210, 255, 0.3);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--orange));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #000;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
        }

        .logo {
            text-align: center;
            font-size: 20px;
            font-weight: 900;
            background: linear-gradient(180deg, #fff 0%, #ffd700 50%, #b38f00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
            line-height: 1;
        }

        .balance-badge {
            background: rgba(0, 210, 255, 0.12);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 10px var(--neon-glow);
        }

        /* Top Widgets */
        .top-widgets {
            display: flex;
            justify-content: space-between;
            padding: 4px 14px;
        }

        .mini-badge {
            border: 1px solid var(--neon-blue);
            border-radius: 14px;
            padding: 3px 8px;
            font-size: 10px;
            background: rgba(0,30,60,0.7);
            color: var(--neon-blue);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        /* Game Slots Grid Frame */
        .game-container {
            position: relative;
            width: 94%;
            max-width: 420px;
            margin: 2px auto 0;
        }

        .slots-frame {
            display: flex;
            gap: 3px;
            background: rgba(1, 15, 30, 0.98);
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 20px var(--neon-glow), inset 0 0 15px var(--neon-glow);
            border-radius: 10px;
            padding: 5px;
            position: relative;
            overflow: hidden;
        }

        .reel {
            flex: 1;
            height: 230px;
            background: var(--card-bg);
            border: 1px solid rgba(0, 210, 255, 0.4);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .reel-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
        }

        .symbol {
            height: 76px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            position: relative;
        }

        /* تنسيق الجرة الممتلئة بالكامل عند الربح (بدون كلمات أجنبية) */
        .symbol.jar-expanded {
            background: radial-gradient(circle, rgba(255,215,0,0.35) 0%, rgba(255,136,0,0.2) 80%);
            border: 2px solid var(--gold);
            box-shadow: inset 0 0 20px var(--gold), 0 0 15px var(--gold);
            border-radius: 6px;
            height: 228px;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 5;
            font-size: 55px;
            animation: jarGlow 1.5s infinite alternate;
        }

        @keyframes jarGlow {
            0% { box-shadow: inset 0 0 10px var(--gold), 0 0 10px var(--gold); }
            100% { box-shadow: inset 0 0 25px var(--gold), 0 0 20px var(--gold); }
        }

        .symbol.seven {
            color: #00f0ff;
            text-shadow: 0 0 12px #00f0ff, 0 0 22px #00d2ff;
            font-weight: 900;
            font-style: italic;
        }

        #lineCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 15;
        }

        /* Win Info Banner */
        .info-panel {
            text-align: center;
            margin: 4px 0;
        }

        .line-info {
            color: var(--neon-blue);
            font-size: 13px;
            font-weight: 700;
        }

        .win-display {
            font-size: 21px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 12px var(--neon-blue);
        }

        /* Bet Selection Chips */
        .bets-container {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 6px;
            padding: 0 10px;
        }

        .bet-chip {
            padding: 5px 10px;
            border-radius: 16px;
            border: 1px solid var(--neon-blue);
            background: rgba(0, 30, 60, 0.75);
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 6px var(--neon-glow);
            transition: all 0.2s;
        }

        .bet-chip.active {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 15px var(--neon-blue);
            font-weight: 900;
        }

        /* Controls Bar */
        .controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 14px;
            margin-bottom: 6px;
        }

        .spin-btn {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            border: 3px solid var(--neon-blue);
            background: radial-gradient(circle, rgba(0,210,255,0.5) 0%, rgba(0,30,60,0.95) 100%);
            box-shadow: 0 0 20px var(--neon-blue), inset 0 0 15px var(--neon-blue);
            color: #fff;
            font-size: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .spin-btn:active { transform: scale(0.92); }
        .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .sub-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid var(--neon-blue);
            background: rgba(0, 20, 40, 0.8);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 0 5px var(--neon-glow);
            transition: 0.2s;
        }
        .sub-btn.active-sub {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
            box-shadow: 0 0 12px var(--gold);
        }

        /* Bottom Stats */
        .history-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 15, 30, 0.95);
            border-top: 1px solid rgba(0, 210, 255, 0.3);
            border-bottom: 1px solid rgba(0, 210, 255, 0.3);
            padding: 5px 0;
            font-size: 11px;
            font-weight: bold;
        }

        /* Navigation Footer */
        .footer-nav {
            display: flex;
            justify-content: space-around;
            background: #020810;
            padding: 8px 0;
            border-top: 1px solid rgba(0,210,255,0.2);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-size: 11px;
            color: #5d7a97;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--neon-blue);
            text-shadow: 0 0 8px var(--neon-blue);
        }

        .blur-spin { filter: blur(4px); }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-body {
            background: #091a2e;
            border-radius: 20px;
            border: 1px solid var(--neon-blue);
            padding: 22px;
            text-align: center;
            max-width: 320px;
            width: 100%;
            box-shadow: 0 0 25px var(--neon-glow);
        }

        .modal-btn {
            background: var(--neon-blue);
            color: #000;
            border: none;
            padding: 9px 24px;
            border-radius: 12px;
            font-weight: 900;
            margin-top: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="top-bar">
        <div class="user-info">
            <div class="avatar" id="u-avatar">U</div>
            <span id="u-name" style="font-weight: bold; font-size: 0.85rem;">اللاعب</span>
        </div>
        <div class="logo">goold<br><span style="font-size: 13px; color: #a1e5ff;">Lera</span></div>
        <div class="balance-badge">
            <span id="u-balance">0.00</span>
            <span style="font-size: 10px;">NSP</span>
        </div>
    </div>

    <!-- Top Widgets -->
    <div class="top-widgets">
        <div class="mini-badge" onclick="showModal('إعدادات اللعبة', 'خيارات اللعب النشطة وتوافق الحسابات.')">
            <span>⚡ 3 3 3</span>
            <span style="font-size: 8px; color: #8cf;">DD HH</span>
        </div>
        <div class="mini-badge" style="border-color: var(--gold); color: var(--gold);" onclick="showModal('مهام اللاعبين', 'أكمل المهام اليومية للحصول على مكافآت مجانية!')">
            <span>🎁 المهام</span>
        </div>
        <div class="mini-badge" onclick="showModal('خيارات النظام', 'النسخة الأصلية المتكاملة مع بوت التيليجرام.')">
            <span>🔲 خيارات</span>
        </div>
    </div>

    <!-- Main Game Board -->
    <div class="game-container">
        <canvas id="lineCanvas"></canvas>
        <div class="slots-frame" id="slotsFrame"></div>
    </div>

    <!-- Win Info Banner -->
    <div class="info-panel">
        <div class="line-info" id="lineInfo">اختر الرهان واضغط ↻ للبدء</div>
        <div class="win-display">ربح <span id="winAmount">0.00</span> NSP</div>
    </div>

    <!-- Bet Selection Chips -->
    <div class="bets-container">
        <div class="bet-chip active" onclick="setBet(3, this)">3 NSP</div>
        <div class="bet-chip" onclick="setBet(6, this)">6 NSP</div>
        <div class="bet-chip" onclick="setBonusBet(9, this)">9 NSP</div>
        <div class="bet-chip" onclick="setBet(15, this)">15 NSP</div>
        <div class="bet-chip" onclick="setBet(50, this)">50 NSP</div>
    </div>

    <!-- Action Buttons Bar -->
    <div class="controls">
        <div class="sub-btn" id="autoBtn" onclick="toggleAutoSpin()" title="دوران تلقائي">▶</div>
        <div class="sub-btn" id="turboBtn" onclick="toggleTurbo()" title="سريع">⚡</div>
        <button class="spin-btn" id="spinBtn" onclick="startSpin()">↻</button>
        <div class="sub-btn" id="x2Btn" onclick="doubleBet()" title="مضاعفة الرهان">x2</div>
        <div class="sub-btn" onclick="showModal('الشحن والعملات', 'رصيدك مرتبط تلقائياً بمحفظتك في بوت التيليجرام.')" title="عملات">🪙</div>
    </div>

    <!-- Bottom Stats -->
    <div class="history-bar">
        <div>🏆 أفضل ربح: <span id="bestWin" style="color: var(--gold);">0.00</span> NSP</div>
        <div>⏱️ آخر ربح: <span id="lastWin" style="color: var(--neon-blue);">0.00</span> NSP</div>
    </div>

    <!-- Navigation Footer -->
    <div class="footer-nav">
        <div class="nav-item active">
            <span>🎰</span>
            <span>اللعبة</span>
        </div>
        <div class="nav-item" onclick="showModal('لوحة الترتيب', 'أفضل اللاعبين هذا الأسبوع.')">
            <span>🏆</span>
            <span>الترتيب</span>
        </div>
        <div class="nav-item" onclick="showModal('حسابي', 'عرض تفاصيل الرصيد والمعرف الشخصي.')">
            <span>👤</span>
            <span>حسابي</span>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="msg-modal">
        <div class="modal-body">
            <div id="modal-status" style="font-size: 1.1rem; font-weight: 900; color: var(--gold); margin-bottom: 6px;">تنبيه</div>
            <p id="modal-desc" style="color: #a1e5ff; font-size: 0.9rem;"></p>
            <button class="modal-btn" onclick="closeModal()">استمرار 🚀</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        let userId = tg?.initDataUnsafe?.user?.id || 7255100997;
        let currentBet = 3;
        let isSpinning = false;
        let currentBalance = 0.00;
        let autoSpinActive = false;
        let turboActive = false;
        let autoInterval = null;

        const SYMBOLS = ['7', '🍊', '🍇', '🍒', '🔔', '🏺'];
        const reelsCount = 5;
        const reelElements = [];
        const slotsFrame = document.getElementById('slotsFrame');

        // نظام أصوات حديث، سينمائي ونقي (Modern Web Audio API)
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playModernSound(type) {
            initAudio();
            if (!audioCtx) return;
            let now = audioCtx.currentTime;

            if (type === 'click') {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.05);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.05);
            } 
            else if (type === 'spin') {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150 + Math.random() * 80, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.linearRampToValueAtTime(0.001, now + 0.06);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.06);
            } 
            else if (type === 'win') {
                // نغمات متطورة نقية ومبهجة تشبه الكازينوهات العالمية الحديثة
                let notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
                notes.forEach((freq, i) => {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + (i * 0.08));
                    gain.gain.setValueAtTime(0.18, now + (i * 0.08));
                    gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.08) + 0.3);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now + (i * 0.08));
                    osc.stop(now + (i * 0.08) + 0.3);
                });
            }
        }

        async function loadUserData() {
            try {
                const res = await fetch('/api/get_user_data', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: userId })
                });
                const data = await res.json();
                if (data.balance !== undefined) {
                    currentBalance = data.balance;
                    document.getElementById('u-balance').innerText = currentBalance.toFixed(2);
                    document.getElementById('u-name').innerText = data.name || "اللاعب";
                    document.getElementById('u-avatar').innerText = (data.name || "U")[0].toUpperCase();
                }
            } catch (err) {
                console.error("فشل إحضار البيانات:", err);
            }
        }
        loadUserData();

        for (let i = 0; i < reelsCount; i++) {
            const reel = document.createElement('div');
            reel.className = 'reel';
            const reelContainer = document.createElement('div');
            reelContainer.className = 'reel-container';
            reel.appendChild(reelContainer);
            slotsFrame.appendChild(reel);
            reelElements.push(reelContainer);
            fillReel(reelContainer, [getRandomSymbol(), getRandomSymbol(), getRandomSymbol()], false);
        }

        function getRandomSymbol() {
            const rand = Math.random();
            if (rand < 0.03) return '🏺'; // نادرة الظهور
            if (rand < 0.25) return '7';
            return SYMBOLS[Math.floor(Math.random() * 4) + 1];
        }

        function createSymbolNode(sym, isJarExpanded = false) {
            const div = document.createElement('div');
            div.className = isJarExpanded ? 'symbol jar-expanded' : 'symbol';
            if (sym === '7') {
                div.classList.add('seven');
                div.innerHTML = '7';
            } else if (sym === '🏺') {
                div.innerHTML = '🏺'; // جرة بشعير بدون أي حروف أجنبية
            } else {
                div.innerHTML = sym;
            }
            return div;
        }

        function fillReel(container, symbolsArray, expandJar = false) {
            container.innerHTML = '';
            if (expandJar) {
                container.appendChild(createSymbolNode('🏺', true));
            } else {
                symbolsArray.forEach(sym => {
                    container.appendChild(createSymbolNode(sym, false));
                });
            }
        }

        function setBet(amount, el) {
            if (isSpinning) return;
            playModernSound('click');
            currentBet = amount;
            document.querySelectorAll('.bet-chip').forEach(b => b.classList.remove('active'));
            if(el) el.classList.add('active');
        }
        function setBonusBet(amount, el) { setBet(amount, el); }

        function doubleBet() {
            playModernSound('click');
            let bets = [3, 6, 9, 15, 50];
            let idx = bets.indexOf(currentBet);
            if (idx < bets.length - 1) {
                currentBet = bets[idx + 1];
            } else {
                currentBet = bets[0];
            }
            let chips = document.querySelectorAll('.bet-chip');
            chips.forEach((c, i) => {
                if(bets[i] === currentBet) {
                    chips.forEach(b => b.classList.remove('active'));
                    c.classList.add('active');
                }
            });
        }

        function toggleAutoSpin() {
            playModernSound('click');
            autoSpinActive = !autoSpinActive;
            let btn = document.getElementById('autoBtn');
            if (autoSpinActive) {
                btn.classList.add('active-sub');
                startSpin();
                autoInterval = setInterval(() => {
                    if (!isSpinning) startSpin();
                }, 1800);
            } else {
                btn.classList.remove('active-sub');
                clearInterval(autoInterval);
            }
        }

        function toggleTurbo() {
            playModernSound('click');
            turboActive = !turboActive;
            document.getElementById('turboBtn').classList.toggle('active-sub', turboActive);
        }

        async function startSpin() {
            if (isSpinning) return;
            if (currentBalance < currentBet) {
                showModal("❌ رصيد غير كافٍ", "يرجى شحن حسابك للبدء بهذه الدورة.");
                if (autoSpinActive) toggleAutoSpin();
                return;
            }

            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            clearCanvas();
            document.getElementById('lineInfo').innerText = 'جاري التدوير...';
            document.getElementById('winAmount').innerText = '0.00';

            let serverResponse = null;
            try {
                const res = await fetch('/api/play_game', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: userId, bet: currentBet, game: 'goold_lera' })
                });
                serverResponse = await res.json();
            } catch (e) {
                console.warn("تنبيه اتصال السيرفر", e);
            }

            let finalGrid = [];
            let speed = turboActive ? 300 : 800;

            const spinPromises = reelElements.map((reelContainer, index) => {
                return new Promise(resolve => {
                    setTimeout(() => {
                        reelContainer.classList.add('blur-spin');
                        let interval = setInterval(() => {
                            playModernSound('spin');
                            fillReel(reelContainer, [getRandomSymbol(), getRandomSymbol(), getRandomSymbol()], false);
                        }, 50);

                        setTimeout(() => {
                            clearInterval(interval);
                            reelContainer.classList.remove('blur-spin');
                            
                            let finalSyms = [getRandomSymbol(), getRandomSymbol(), getRandomSymbol()];
                            fillReel(reelContainer, finalSyms, false);
                            finalGrid.push(finalSyms);
                            resolve();
                        }, speed + index * 150);
                    }, index * 40);
                });
            });

            await Promise.all(spinPromises);

            if (serverResponse && serverResponse.new_balance !== undefined) {
                currentBalance = serverResponse.new_balance;
                document.getElementById('u-balance').innerText = currentBalance.toFixed(2);
            }

            evaluateStrictWin(finalGrid, serverResponse);
            isSpinning = false;
            document.getElementById('spinBtn').disabled = false;
        }

        function evaluateStrictWin(grid, serverResponse) {
            let rows = [0, 1, 2].map(r => grid.map(reel => reel[r]));
            let totalMultiplier = 0;
            let matchedLines = [];

            let lineConfigs = [
                { type: 'horizontal', r: 0 },
                { type: 'horizontal', r: 1 },
                { type: 'horizontal', r: 2 },
                { type: 'diagonal_down', path: [0, 1, 2, 1, 0] },
                { type: 'diagonal_up', path: [2, 1, 0, 1, 2] }
            ];

            lineConfigs.forEach((cfg, lineIdx) => {
                let symbolsOnLine = [];
                if (cfg.type === 'horizontal') {
                    symbolsOnLine = rows[cfg.r];
                } else if (cfg.type === 'diagonal_down') {
                    symbolsOnLine = [rows[0][0], rows[1][1], rows[2][2], rows[1][3], rows[0][4]];
                } else if (cfg.type === 'diagonal_up') {
                    symbolsOnLine = [rows[2][0], rows[1][1], rows[0][2], rows[1][3], rows[2][4]];
                }

                let first = symbolsOnLine[0];
                if (!first) return;

                let base = first === '🏺' ? symbolsOnLine.find(s => s !== '🏺' && s !== undefined) || '7' : first;
                let count = 0;

                for (let i = 0; i < symbolsOnLine.length; i++) {
                    let s = symbolsOnLine[i];
                    if (s === base || s === '🏺') {
                        count++;
                    } else {
                        break;
                    }
                }

                let mult = 0;
                if (count >= 3) {
                    if (count === 5) {
                        if (base === '7') mult = 100;
                        else if (base === '🍇') mult = 25;
                        else mult = 10;
                    } else if (count === 4) {
                        if (base === '7') mult = 20;
                        else if (base === '🍇') mult = 8;
                        else mult = 4;
                    } else if (count === 3) {
                        if (base === '7') mult = 5;
                        else if (base === '🍇') mult = 2;
                        else mult = 1;
                    }
                }

                if (mult > 0) {
                    totalMultiplier += mult;
                    matchedLines.push({ config: cfg, mult, count });
                }
            });

            let winAmount = 0;
            if (serverResponse && serverResponse.win) {
                winAmount = serverResponse.win_amount;
            } else if (!serverResponse || !serverResponse.win) {
                totalMultiplier = 0;
                winAmount = 0;
            }

            if (winAmount > 0) {
                playModernSound('win');
                document.getElementById('winAmount').innerText = winAmount.toFixed(2);
                document.getElementById('lineInfo').innerText = `مبروك! ربحت ${winAmount.toFixed(2)} NSP`;
                document.getElementById('lastWin').innerText = winAmount.toFixed(2);

                let best = parseFloat(document.getElementById('bestWin').innerText);
                if (winAmount > best) document.getElementById('bestWin').innerText = winAmount.toFixed(2);

                confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
                
                // الجرة تملء البكرة عند الربح فقط
                reelElements.forEach((reelContainer, idx) => {
                    if (Math.random() < 0.4) {
                        fillReel(reelContainer, [], true);
                    }
                });

                drawWinningLines(matchedLines);
            } else {
                document.getElementById('winAmount').innerText = '0.00';
                document.getElementById('lineInfo').innerText = 'حظ أوفر في الضربة القادمة';
                clearCanvas();
            }
        }

        function drawWinningLines(lines) {
            const canvas = document.getElementById('lineCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            let rowHeight = canvas.height / 3;

            lines.forEach(l => {
                let cfg = l.config;
                ctx.beginPath();
                if (cfg.type === 'horizontal') {
                    let y = (cfg.r * rowHeight) + (rowHeight / 2);
                    ctx.moveTo(10, y);
                    ctx.lineTo(canvas.width - 10, y);
                } else {
                    ctx.moveTo(10, canvas.height / 2);
                    ctx.lineTo(canvas.width - 10, canvas.height / 2);
                }
                ctx.strokeStyle = '#00f0ff';
                ctx.lineWidth = 3;
                ctx.shadowColor = '#00f0ff';
                ctx.shadowBlur = 10;
                ctx.stroke();
            });
        }

        function clearCanvas() {
            const canvas = document.getElementById('lineCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function showModal(title, desc) {
            playModernSound('click');
            document.getElementById('modal-status').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('msg-modal').style.display = 'flex';
        }

        function closeModal() {
            playModernSound('click');
            document.getElementById('msg-modal').style.display = 'none';
        }
    </script>
</body>
</html>
