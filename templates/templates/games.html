<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كازينو الألعاب الخرافية</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-gold: #f59e0b;
            --text-color: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            text-align: center;
        }

        .header {
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #4338ca;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .balance-badge {
            font-size: 1.2rem;
            color: var(--accent-gold);
            font-weight: bold;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #334155;
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
        }

        .game-card:active {
            transform: scale(0.96);
            border-color: var(--accent-gold);
        }

        .game-icon {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }

        .game-title {
            font-weight: bold;
            font-size: 1rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            width: 85%;
            max-width: 350px;
            border: 2px solid var(--accent-gold);
        }

        .wheel {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 5px solid var(--accent-gold);
            margin: 15px auto;
            transition: transform 3s cubic-bezier(0.15, 0.9, 0.15, 1);
            background: conic-gradient(#ef4444 0 60deg, #3b82f6 60deg 120deg, #10b981 120deg 180deg, #f59e0b 180deg 240deg, #8b5cf6 240deg 300deg, #ec4899 300deg 360deg);
        }

        .btn-play {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            width: 100%;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <div id="username">مرحباً بك!</div>
        <div>رصيدك الحالي: <span class="balance-badge" id="balance">0.00</span> ليرة سورية جديدة</div>
    </div>

    <h2>🎰 صالة الألعاب العالمية (1x - 100x)</h2>

    <div class="games-grid">
        <div class="game-card" onclick="openGame('🎡 عجلة الحظ')">
            <div class="game-icon">🎡</div>
            <div class="game-title">عجلة الحظ</div>
        </div>
        <div class="game-card" onclick="openGame('🎰 ماكينة السلوتس')">
            <div class="game-icon">🎰</div>
            <div class="game-title">ماكينة السلوتس</div>
        </div>
        <div class="game-card" onclick="openGame('💣 لعبة الألغام')">
            <div class="game-icon">💣</div>
            <div class="game-title">الألغام</div>
        </div>
        <div class="game-card" onclick="openGame('🎲 رمي النرد')">
            <div class="game-icon">🎲</div>
            <div class="game-title">رمي النرد</div>
        </div>
        <div class="game-card" onclick="openGame('🪙 رمي العملة')">
            <div class="game-icon">🪙</div>
            <div class="game-title">عملة شام</div>
        </div>
        <div class="game-card" onclick="openGame('🚀 لعبة الطائرة')">
            <div class="game-icon">🚀</div>
            <div class="game-title">الطائرة الصاعدة</div>
        </div>
        <div class="game-card" onclick="openGame('🎴 أعلى أو أقل')">
            <div class="game-icon">🎴</div>
            <div class="game-title">أعلى أم أقل</div>
        </div>
        <div class="game-card" onclick="openGame('🔮 لعبة الكؤوس')">
            <div class="game-icon">🔮</div>
            <div class="game-title">الكؤوس السحرية</div>
        </div>
        <div class="game-card" onclick="openGame('🎯 الروليت الملكي')">
            <div class="game-icon">🎯</div>
            <div class="game-title">الروليت الملكي</div>
        </div>
        <div class="game-card" onclick="openGame('⚪ البلينكو')">
            <div class="game-icon">⚪</div>
            <div class="game-title">البلينكو</div>
        </div>
    </div>

    <!-- Game Modal -->
    <div class="modal" id="gameModal">
        <div class="modal-content">
            <h3 id="modalTitle">اسم اللعبة</h3>
            <div class="wheel" id="wheel"></div>
            <div>
                <label>مبلغ الرهان (ليرة جديدة):</label>
                <input type="number" id="betAmount" value="100" min="10">
            </div>
            <button class="btn-play" onclick="spinWheel()">ابدأ اللعب الآن</button>
            <button class="btn-play" style="background:#64748b; margin-top:5px;" onclick="closeModal()">إغلاق</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let tgUser = tg.initDataUnsafe?.user || { id: 12345678, first_name: "زائر" };
        document.getElementById('username').innerText = `👤 ${tgUser.first_name}`;

        async function fetchUser() {
            try {
                let res = await fetch(`/api/get_user?tg_id=${tgUser.id}`);
                let data = await res.json();
                if(data.balance !== undefined) {
                    document.getElementById('balance').innerText = data.balance.toFixed(2);
                }
            } catch(e) {}
        }
        fetchUser();

        let currentRotate = 0;
        function openGame(title) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('gameModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('gameModal').style.display = 'none';
        }

        async function spinWheel() {
            let bet = parseFloat(document.getElementById('betAmount').value);
            if(!bet || bet <= 0) {
                alert("يرجى إدخال مبلغ رهان صحيح");
                return;
            }

            try {
                let response = await fetch('/api/play_game', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tg_id: tgUser.id, bet: bet, game_type: 'wheel' })
                });

                let result = await response.json();
                if(!result.success) {
                    alert(result.message);
                    return;
                }

                currentRotate += 1440 + Math.floor(Math.random() * 360);
                document.getElementById('wheel').style.transform = `rotate(${currentRotate}deg)`;

                setTimeout(() => {
                    if(result.is_win) {
                        alert(`🎉 مبروك! فزت بمضاعف x${result.multiplier} وحصلت على ${result.payout} ليرة جديدة!`);
                    } else {
                        alert("❌ حظاً أفر في المرة القادمة!");
                    }
                    document.getElementById('balance').innerText = result.new_balance.toFixed(2);
                }, 3100);

            } catch(e) {
                alert("حدث خطأ أثناء التواصل مع السيرفر");
            }
        }
    </script>
</body>
</html>
