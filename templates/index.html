<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Golden Tree - Ultra Pro Edition 2026</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-glow: rgba(0, 243, 255, 0.85);
            --gold: #ffdf00;
            --gold-glow: rgba(255, 223, 0, 0.9);
            --bg-dark: #000206;
            --card-bg: rgba(2, 12, 25, 0.99);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at center, #06203d 0%, var(--bg-dark) 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background: rgba(1, 5, 12, 0.99);
            border-bottom: 1.5px solid rgba(0, 243, 255, 0.4);
            backdrop-filter: blur(15px);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), #ff8800);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #000;
            box-shadow: 0 0 18px var(--gold-glow);
        }

        .logo {
            text-align: center;
            font-size: 19px;
            font-weight: 900;
            background: linear-gradient(180deg, #fff 0%, var(--gold) 50%, #b38f00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 18px rgba(255, 223, 0, 0.6);
            line-height: 1.1;
        }

        .balance-badge {
            background: rgba(0, 243, 255, 0.12);
            border: 1.5px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 15px var(--neon-glow);
        }

        /* Top Widgets */
        .top-widgets {
            display: flex;
            justify-content: space-between;
            padding: 4px 14px;
        }

        .mini-badge {
            border: 1px solid var(--neon-blue);
            border-radius: 12px;
            padding: 4px 10px;
            font-size: 10px;
            background: rgba(0,30,60,0.85);
            color: var(--neon-blue);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .mini-badge:active { transform: scale(0.95); }

        /* Game Slots Grid Frame */
        .game-container {
            position: relative;
            width: 95%;
            max-width: 420px;
            margin: 4px auto 0;
            perspective: 1000px;
        }

        .slots-frame {
            display: flex;
            gap: 4px;
            background: rgba(1, 5, 12, 0.99);
            border: 3px solid var(--neon-blue);
            box-shadow: 0 0 45px var(--neon-glow), inset 0 0 25px var(--neon-glow);
            border-radius: 18px;
            padding: 6px;
            position: relative;
            overflow: hidden;
            height: 252px;
        }

        .slots-frame.shake {
            animation: screenShake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes screenShake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* البكرة الهيكلية */
        .reel {
            flex: 1;
            height: 240px;
            background: var(--card-bg);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        /* الشريط المتحرك داخل البكرة */
        .reel-strip {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            will-change: transform;
        }

        /* دوران سريع وسلس باستخدام انيميشن رأسية */
        .reel-strip.spinning {
            animation: fastSpin 0.18s linear infinite;
        }

        @keyframes fastSpin {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-240px); }
        }

        .symbol {
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            flex-shrink: 0;
        }

        .symbol-badge {
            width: 68px;
            height: 68px;
            border-radius: 18px;
            background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.25), rgba(0,10,25,0.85));
            border: 1.5px solid rgba(0, 243, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 4px 10px rgba(0,0,0,0.5);
            font-size: 40px;
        }

        /* الجرة الذهبية النادرة */
        .symbol.jar-rare .symbol-badge {
            background: radial-gradient(circle, #ffe600 0%, #ff6600 70%, #883300 100%);
            border: 2px solid var(--gold);
            box-shadow: 0 0 25px var(--gold-glow), inset 0 0 15px #fff;
            animation: jarPulse 0.8s infinite alternate ease-in-out;
        }

        /* الجرة الرابحة تعبئ البكرة كاملة */
        .symbol.jar-win-full {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 240px !important;
            z-index: 50;
            animation: jarExpandReel 0.5s forwards ease-out;
        }

        .symbol.jar-win-full .symbol-badge {
            width: 95%;
            height: 95%;
            border-radius: 14px;
            font-size: 90px;
            background: radial-gradient(circle, #fff7a1 0%, #ffaa00 50%, #881100 100%);
            border: 3px solid #fff;
            box-shadow: 0 0 50px var(--gold), inset 0 0 30px #fff;
        }

        @keyframes jarExpandReel {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .jar-mult-tag {
            position: absolute;
            bottom: -2px;
            right: -2px;
            background: #ff0055;
            color: #fff;
            font-size: 11px;
            font-weight: 900;
            padding: 1px 6px;
            border-radius: 10px;
            border: 1px solid #fff;
            box-shadow: 0 0 10px #ff0055;
            z-index: 55;
        }

        @keyframes jarPulse {
            0% { transform: scale(0.95); filter: drop-shadow(0 0 10px var(--gold)); }
            100% { transform: scale(1.08); filter: drop-shadow(0 0 30px var(--gold)); }
        }

        /* الرقم 7 */
        .symbol.seven .symbol-badge {
            background: radial-gradient(circle, #ff0055 0%, #770022 100%);
            border: 2px solid #ff3377;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.85);
            color: #fff;
            text-shadow: 0 0 15px #ff99bb, 0 2px 4px rgba(0,0,0,0.8);
            font-weight: 900;
            font-style: italic;
            font-size: 42px;
        }

        /* تأثير لمعان الربح */
        .symbol.win-pop .symbol-badge {
            animation: symbolWinAnim 0.6s infinite alternate cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-color: var(--gold);
            z-index: 10;
        }

        @keyframes symbolWinAnim {
            0% { transform: scale(1); filter: brightness(1); box-shadow: 0 0 10px var(--gold-glow); }
            100% { transform: scale(1.18); filter: brightness(1.5); box-shadow: 0 0 35px var(--gold), inset 0 0 15px #fff; }
        }

        /* بنر الجرة العائم */
        .jar-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(135deg, #ff0055, #ffaa00);
            border: 3px solid #fff;
            padding: 12px 24px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 20px;
            color: #fff;
            box-shadow: 0 0 50px var(--gold);
            z-index: 100;
            pointer-events: none;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }
        .jar-banner.show {
            transform: translate(-50%, -50%) scale(1.1);
        }

        /* Win Info Banner */
        .info-panel {
            text-align: center;
            margin: 4px 0;
        }

        .line-info {
            color: var(--neon-blue);
            font-size: 13px;
            font-weight: 700;
            text-shadow: 0 0 12px var(--neon-blue);
            min-height: 20px;
        }

        .win-display {
            font-size: 23px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 18px var(--neon-blue);
        }

        /* Bet Selection Chips */
        .bets-container {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 6px;
            padding: 0 10px;
        }

        .bet-chip {
            padding: 6px 12px;
            border-radius: 16px;
            border: 1.5px solid var(--neon-blue);
            background: rgba(0, 30, 60, 0.9);
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-glow);
            transition: all 0.2s;
        }

        .bet-chip.active {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 25px var(--neon-blue);
            font-weight: 900;
            transform: scale(1.08);
        }

        /* Controls Bar */
        .controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 14px;
            margin-bottom: 6px;
        }

        .spin-btn {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            border: 3.5px solid var(--neon-blue);
            background: radial-gradient(circle, rgba(0,243,255,0.9) 0%, rgba(1,5,12,0.99) 100%);
            box-shadow: 0 0 40px var(--neon-blue), inset 0 0 22px var(--neon-blue);
            color: #fff;
            font-size: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .spin-btn:active { transform: scale(0.9); }

        .sub-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1.5px solid var(--neon-blue);
            background: rgba(1, 5, 12, 0.92);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-glow);
            transition: 0.2s;
        }
        .sub-btn.active-sub {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
            box-shadow: 0 0 20px var(--gold);
        }

        /* Bottom Stats */
        .history-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(1, 5, 12, 0.99);
            border-top: 1.5px solid rgba(0, 243, 255, 0.4);
            border-bottom: 1.5px solid rgba(0, 243, 255, 0.4);
            padding: 6px 0;
            font-size: 11px;
            font-weight: bold;
        }

        /* Navigation Footer */
        .footer-nav {
            display: flex;
            justify-content: space-around;
            background: #000103;
            padding: 8px 0;
            border-top: 1px solid rgba(0,243,255,0.25);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-size: 11px;
            color: #5d7a97;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-item.active {
            color: var(--neon-blue);
            text-shadow: 0 0 12px var(--neon-blue);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(10px);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-body {
            background: #031020;
            border-radius: 22px;
            border: 2px solid var(--neon-blue);
            padding: 26px;
            text-align: center;
            max-width: 320px;
            width: 100%;
            box-shadow: 0 0 45px var(--neon-glow);
        }

        .modal-btn {
            background: var(--neon-blue);
            color: #000;
            border: none;
            padding: 10px 28px;
            border-radius: 12px;
            font-weight: 900;
            margin-top: 16px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--neon-blue);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="top-bar">
        <div class="user-info">
            <div class="avatar" id="u-avatar">U</div>
            <span id="u-name" style="font-weight: bold; font-size: 0.85rem;">اللاعب</span>
        </div>
        <div class="logo">Golden Tree<br><span style="font-size: 11px; color: #a1e5ff;">Pro Master 2026</span></div>
        <div class="balance-badge">
            <span id="u-balance">0.00</span>
            <span style="font-size: 10px;">NSP</span>
        </div>
    </div>

    <!-- Top Widgets -->
    <div class="top-widgets">
        <div class="mini-badge" onclick="showModal('إعدادات اللعبة', 'نظام كازينو Golden Tree الاحترافي.')">
            <span>⚡ 3 سرعات</span>
            <span style="font-size: 8px; color: #8cf;">PRO HD</span>
        </div>
        <div class="mini-badge" style="border-color: var(--gold); color: var(--gold);" onclick="showModal('مهام اللاعبين', 'أكمل المهام اليومية واحصل على جوائز فورية!')">
            <span>🎁 المهام</span>
        </div>
        <div class="mini-badge" onclick="showModal('خيارات النظام', 'متصل آمن مع خوادم التيليجرام الذكية.')">
            <span>🔲 خيارات</span>
        </div>
    </div>

    <!-- Main Game Board -->
    <div class="game-container">
        <div class="jar-banner" id="jarBanner">مضاعف الجرة الخارقة! <br> <span id="jarMultText" style="font-size: 28px; color: var(--gold);">5x</span></div>
        <div class="slots-frame" id="slotsFrame"></div>
    </div>

    <!-- Win Info Banner -->
    <div class="info-panel">
        <div class="line-info" id="lineInfo">اختر الرهان واضغط ↻ للبدء</div>
        <div class="win-display">ربح <span id="winAmount">0.00</span> NSP</div>
    </div>

    <!-- Bet Selection Chips -->
    <div class="bets-container">
        <div class="bet-chip active" onclick="setBet(3, this)">3 NSP</div>
        <div class="bet-chip" onclick="setBet(6, this)">6 NSP</div>
        <div class="bet-chip" onclick="setBet(9, this)">9 NSP</div>
        <div class="bet-chip" onclick="setBet(15, this)">15 NSP</div>
        <div class="bet-chip" onclick="setBet(50, this)">50 NSP</div>
    </div>

    <!-- Action Buttons Bar -->
    <div class="controls">
        <div class="sub-btn" id="autoBtn" onclick="toggleAutoSpin()" title="دوران تلقائي">▶</div>
        <div class="sub-btn" id="speedBtn" onclick="cycleSpeed()" title="السرعة">🐢</div>
        <button class="spin-btn" id="spinBtn" onclick="handleSpinButton()">↻</button>
        <div class="sub-btn" onclick="doubleBet()" title="مضاعفة الرهان">x2</div>
        <div class="sub-btn" onclick="showModal('الشحن والعملات', 'الرصيد مرتبط فوري بمحفظتك.')" title="عملات">🪙</div>
    </div>

    <!-- Bottom Stats -->
    <div class="history-bar">
        <div>🏆 أفضل ربح: <span id="bestWin" style="color: var(--gold);">0.00</span> NSP</div>
        <div>⏱️ آخر ربح: <span id="lastWin" style="color: var(--neon-blue);">0.00</span> NSP</div>
    </div>

    <!-- Navigation Footer -->
    <div class="footer-nav">
        <div class="nav-item active">
            <span>🎰</span>
            <span>اللعبة</span>
        </div>
        <div class="nav-item" onclick="showModal('لوحة الترتيب', 'أفضل اللاعبين هذا الأسبوع.')">
            <span>🏆</span>
            <span>الترتيب</span>
        </div>
        <div class="nav-item" onclick="showModal('حسابي', 'عرض تفاصيل الحساب والمعرف الشخصي.')">
            <span>👤</span>
            <span>حسابي</span>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="msg-modal">
        <div class="modal-body">
            <div id="modal-status" style="font-size: 1.15rem; font-weight: 900; color: var(--gold); margin-bottom: 8px;">تنبيه</div>
            <p id="modal-desc" style="color: #a1e5ff; font-size: 0.95rem; line-height: 1.5;"></p>
            <button class="modal-btn" onclick="closeModal()">استمرار 🚀</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        let userId = tg?.initDataUnsafe?.user?.id || 7255100997;
        let currentBet = 3;
        let isSpinning = false;
        let forceStopRequested = false;
        let currentBalance = 0.00;
        let autoSpinActive = false;
        let speedLevel = 1;
        let autoInterval = null;

        const reelsCount = 5;
        const reelStrips = [];
        const slotsFrame = document.getElementById('slotsFrame');

        // Audio Engine
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playProSound(type) {
            initAudio();
            if (!audioCtx) return;
            let now = audioCtx.currentTime;

            if (type === 'click') {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.04);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.linearRampToValueAtTime(0.001, now + 0.04);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.04);
            } 
            else if (type === 'spin_tick') {
                // صوت تك تك متكرر أثناء الدوران السريع
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120 + Math.random() * 40, now);
                gain.gain.setValueAtTime(0.04, now);
                gain.gain.linearRampToValueAtTime(0.001, now + 0.03);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.03);
            }
            else if (type === 'reel_stop') {
                // صوت توقف واستقرار البكرة
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.001, now + 0.08);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.08);
            }
            else if (type === 'jar_appear_win') {
                [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((freq, i) => {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + (i * 0.05));
                    gain.gain.setValueAtTime(0.2, now + (i * 0.05));
                    gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.05) + 0.35);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now + (i * 0.05));
                    osc.stop(now + (i * 0.05) + 0.35);
                });
            }
            else if (type === 'jar_appear_lose') {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(90, now + 0.25);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.001, now + 0.25);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.25);
            }
            else if (type === 'win_fruit') {
                [440, 554.37, 659.25].forEach((freq, i) => {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + (i * 0.06));
                    gain.gain.setValueAtTime(0.1, now + (i * 0.06));
                    gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.06) + 0.2);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now + (i * 0.06));
                    osc.stop(now + (i * 0.06) + 0.2);
                });
            }
            else if (type === 'win_seven') {
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + (i * 0.05));
                    gain.gain.setValueAtTime(0.15, now + (i * 0.05));
                    gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.05) + 0.3);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now + (i * 0.05));
                    osc.stop(now + (i * 0.05) + 0.3);
                });
            }
        }

        async function loadUserData() {
            try {
                const res = await fetch('/api/get_user_data', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: userId })
                });
                const data = await res.json();
                if (data.balance !== undefined) {
                    currentBalance = data.balance;
                    document.getElementById('u-balance').innerText = currentBalance.toFixed(2);
                    document.getElementById('u-name').innerText = data.name || "اللاعب";
                    document.getElementById('u-avatar').innerText = (data.name || "U")[0].toUpperCase();
                }
            } catch (err) {
                console.warn("استخدام الوضع الافتراضي");
            }
        }
        loadUserData();

        // بناء البكرات الخمس والأشرطة
        for (let i = 0; i < reelsCount; i++) {
            const reel = document.createElement('div');
            reel.className = 'reel';
            
            const reelStrip = document.createElement('div');
            reelStrip.className = 'reel-strip';
            reel.appendChild(reelStrip);
            slotsFrame.appendChild(reel);
            
            reelStrips.push(reelStrip);

            // ملء البكرة بـ 6 عناصر مبدئية لإنشاء حركة دوران مستمرة
            populateStrip(reelStrip, generateRandomSymbolsList(6, false));
        }

        function generateRandomSymbolObj(allowJar = true) {
            const rand = Math.random();
            if (allowJar && rand < 0.02) {
                let mults = [1, 2, 3, 5];
                let chosenMult = mults[Math.floor(Math.random() * mults.length)];
                return { sym: '🏺', mult: chosenMult };
            }
            if (rand < 0.035) return { sym: '7', mult: 1 };
            if (rand < 0.12) return { sym: '🍇', mult: 1 };

            const fruits = ['🍋', '🍍', '🍊', '🍒', '🔔'];
            return { sym: fruits[Math.floor(Math.random() * fruits.length)], mult: 1 };
        }

        function generateRandomSymbolsList(count, allowJar = true) {
            let list = [];
            for (let i = 0; i < count; i++) {
                list.push(generateRandomSymbolObj(allowJar));
            }
            return list;
        }

        function createSymbolNode(symObj) {
            const div = document.createElement('div');
            div.className = 'symbol';
            
            const badge = document.createElement('div');
            badge.className = 'symbol-badge';

            if (symObj.sym === '7') {
                div.classList.add('seven');
                badge.innerText = '7';
            } else if (symObj.sym === '🏺') {
                div.classList.add('jar-rare');
                badge.innerText = '🏺';
                if (symObj.mult > 1) {
                    const multTag = document.createElement('div');
                    multTag.className = 'jar-mult-tag';
                    multTag.innerText = symObj.mult + 'x';
                    badge.appendChild(multTag);
                }
            } else {
                badge.innerText = symObj.sym;
            }

            div.appendChild(badge);
            return div;
        }

        function populateStrip(strip, symbolsArray) {
            strip.innerHTML = '';
            symbolsArray.forEach(symObj => {
                strip.appendChild(createSymbolNode(symObj));
            });
        }

        function setBet(amount, el) {
            if (isSpinning) return;
            playProSound('click');
            currentBet = amount;
            document.querySelectorAll('.bet-chip').forEach(b => b.classList.remove('active'));
            if(el) el.classList.add('active');
        }

        function doubleBet() {
            if (isSpinning) return;
            playProSound('click');
            let bets = [3, 6, 9, 15, 50];
            let idx = bets.indexOf(currentBet);
            currentBet = (idx < bets.length - 1) ? bets[idx + 1] : bets[0];
            let chips = document.querySelectorAll('.bet-chip');
            chips.forEach((c, i) => {
                c.classList.toggle('active', bets[i] === currentBet);
            });
        }

        function toggleAutoSpin() {
            playProSound('click');
            autoSpinActive = !autoSpinActive;
            let btn = document.getElementById('autoBtn');
            if (autoSpinActive) {
                btn.classList.add('active-sub');
                startSpin();
                autoInterval = setInterval(() => {
                    if (!isSpinning) startSpin();
                }, 1800);
            } else {
                btn.classList.remove('active-sub');
                clearInterval(autoInterval);
            }
        }

        function cycleSpeed() {
            playProSound('click');
            speedLevel = (speedLevel % 3) + 1;
            let btn = document.getElementById('speedBtn');
            btn.innerText = speedLevel === 1 ? '🐢' : (speedLevel === 2 ? '🚀' : '⚡');
        }

        function handleSpinButton() {
            initAudio();
            if (isSpinning) {
                forceStopRequested = true;
            } else {
                startSpin();
            }
        }

        async function startSpin() {
            if (isSpinning) return;
            if (currentBalance < currentBet) {
                showModal("❌ رصيد غير كافٍ", "يرجى شحن حسابك للبدء.");
                if (autoSpinActive) toggleAutoSpin();
                return;
            }

            isSpinning = true;
            forceStopRequested = false;
            currentBalance -= currentBet;
            document.getElementById('u-balance').innerText = currentBalance.toFixed(2);
            document.getElementById('spinBtn').innerText = '⏹️';
            clearShineEffects();
            hideJarBanner();
            document.getElementById('lineInfo').innerText = 'جاري التدوير...';
            document.getElementById('winAmount').innerText = '0.00';

            let serverResponse = null;
            try {
                const res = await fetch('/api/play_game', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: userId, bet: currentBet, game: 'golden_tree' })
                });
                serverResponse = await res.json();
            } catch (e) {
                console.warn("تنبيه اتصال السيرفر", e);
            }

            // تشغيل صوت التدوير المستمر أثناء دوران البكرات
            let spinSoundInterval = setInterval(() => {
                if (isSpinning) {
                    playProSound('spin_tick');
                }
            }, 70);

            // 1. تشغيل الدوران المباشر لجميع الأشرطة البكرية معاً بنفس الوقت
            reelStrips.forEach(strip => {
                populateStrip(strip, generateRandomSymbolsList(9, false));
                strip.classList.add('spinning');
            });

            let finalGrid = [];
            let baseWait = speedLevel === 1 ? 800 : (speedLevel === 2 ? 400 : 150);
            let stepDelay = speedLevel === 1 ? 250 : (speedLevel === 2 ? 140 : 60);

            // 2. توقف البكرات واحدة تلو الأخرى بالترتيب من أقصى اليمين (4) إلى أقصى اليسار (0)
            const stopOrder = [4, 3, 2, 1, 0];

            for (let step = 0; step < stopOrder.length; step++) {
                let reelIdx = stopOrder[step];
                let currentDelay = forceStopRequested ? (step * 35) : (baseWait + step * stepDelay);

                await new Promise(resolve => setTimeout(resolve, currentDelay));

                let strip = reelStrips[reelIdx];
                strip.classList.remove('spinning');

                // الرموز النهائية المستقرة داخل البكرة
                let finalSyms = [generateRandomSymbolObj(true), generateRandomSymbolObj(false), generateRandomSymbolObj(false)];
                populateStrip(strip, finalSyms);
                finalGrid[reelIdx] = finalSyms;

                // تشغيل صوت توقف البكرة فور استقرارها
                playProSound('reel_stop');
            }

            clearInterval(spinSoundInterval);
            evaluateRightToLeftWin(finalGrid, serverResponse);
            isSpinning = false;
            forceStopRequested = false;
            document.getElementById('spinBtn').innerText = '↻';
        }

        // حساب الأرباح
        function evaluateRightToLeftWin(grid, serverResponse) {
            let totalMultiplier = 0;
            let matchedCoords = [];
            let maxJarMultFound = 1;
            let isJarInWin = false;
            let winningSymbolType = 'fruit';
            let jarReelIndexToExpand = -1;
            let anyJarAppeared = false;

            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 3; c++) {
                    if (grid[r] && grid[r][c] && grid[r][c].sym === '🏺') {
                        anyJarAppeared = true;
                    }
                }
            }

            let paylines = [
                [[4,0], [3,0], [2,0], [1,0], [0,0]],
                [[4,1], [3,1], [2,1], [1,1], [0,1]],
                [[4,2], [3,2], [2,2], [1,2], [0,2]],
                [[4,0], [3,1], [2,2], [1,1], [0,0]],
                [[4,2], [3,1], [2,0], [1,1], [0,2]]
            ];

            paylines.forEach(path => {
                let firstCoord = path[0];
                let firstObj = grid[firstCoord[0]][firstCoord[1]];

                if (!firstObj) return;

                let baseSym = firstObj.sym;
                let count = 0;
                let lineJarMult = 1;

                if (baseSym === '🏺') {
                    isJarInWin = true;
                    jarReelIndexToExpand = firstCoord[0];
                    if (firstObj.mult > lineJarMult) lineJarMult = firstObj.mult;
                    for(let k = 1; k < path.length; k++) {
                        let obj = grid[path[k][0]][path[k][1]];
                        if(obj.sym !== '🏺') {
                            baseSym = obj.sym;
                            break;
                        }
                    }
                }

                if (!baseSym || baseSym === '🏺') return;

                let currentLineCoords = [];

                for (let step of path) {
                    let item = grid[step[0]][step[1]];
                    if (item.sym === baseSym || item.sym === '🏺') {
                        count++;
                        currentLineCoords.push(step);
                        if (item.sym === '🏺') {
                            isJarInWin = true;
                            jarReelIndexToExpand = step[0];
                            if (item.mult > lineJarMult) lineJarMult = item.mult;
                        }
                    } else {
                        break;
                    }
                }

                let lineBaseMult = 0;

                if (['🍋', '🍍', '🍊', '🍒', '🔔'].includes(baseSym)) {
                    if (count === 3) lineBaseMult = 1;
                    else if (count === 4) lineBaseMult = 2;
                    else if (count >= 5) lineBaseMult = 5;
                }
                else if (baseSym === '🍇') {
                    if (count === 3) lineBaseMult = 2;
                    else if (count === 4) lineBaseMult = 3;
                    else if (count >= 5) lineBaseMult = 10;
                    if (lineBaseMult > 0) winningSymbolType = 'grapes';
                }
                else if (baseSym === '7') {
                    if (count === 2) lineBaseMult = 2;
                    else if (count === 3) lineBaseMult = 3;
                    else if (count === 4) lineBaseMult = 5;
                    else if (count >= 5) lineBaseMult = 20;
                    if (lineBaseMult > 0) winningSymbolType = 'seven';
                }

                if (lineBaseMult > 0) {
                    totalMultiplier += (lineBaseMult * lineJarMult);
                    if (lineJarMult > maxJarMultFound) maxJarMultFound = lineJarMult;
                    matchedCoords.push(...currentLineCoords);
                }
            });

            let finalWinAmount = 0;
            if (serverResponse && serverResponse.win !== undefined) {
                finalWinAmount = serverResponse.win_amount;
            } else {
                finalWinAmount = totalMultiplier * currentBet;
            }

            if (finalWinAmount > 0) {
                currentBalance += finalWinAmount;
                document.getElementById('u-balance').innerText = currentBalance.toFixed(2);

                if (isJarInWin) {
                    playProSound('jar_appear_win');
                    expandJarToFullReel(jarReelIndexToExpand, maxJarMultFound);
                    triggerScreenShake();
                    showJarBanner(maxJarMultFound);
                } else if (winningSymbolType === 'seven') {
                    playProSound('win_seven');
                } else {
                    playProSound('win_fruit');
                }

                document.getElementById('winAmount').innerText = finalWinAmount.toFixed(2);
                document.getElementById('lineInfo').innerText = `مبروك! ربحت ${finalWinAmount.toFixed(2)} NSP`;
                document.getElementById('lastWin').innerText = finalWinAmount.toFixed(2);

                let best = parseFloat(document.getElementById('bestWin').innerText);
                if (finalWinAmount > best) document.getElementById('bestWin').innerText = finalWinAmount.toFixed(2);

                confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } });
                applyShineToWinners(matchedCoords);
            } else {
                if (anyJarAppeared && !isJarInWin) {
                    playProSound('jar_appear_lose');
                }
                document.getElementById('winAmount').innerText = '0.00';
                document.getElementById('lineInfo').innerText = 'حظ أوفر في المحاولة القادمة';
            }
        }

        // تمدد الجرة لتغطية البكرة
        function expandJarToFullReel(reelIndex, mult) {
            if (reelIndex < 0 || reelIndex >= reelsCount) return;
            const reelStrip = reelStrips[reelIndex];
            reelStrip.innerHTML = '';

            const fullJarNode = document.createElement('div');
            fullJarNode.className = 'symbol jar-win-full';

            const badge = document.createElement('div');
            badge.className = 'symbol-badge';
            badge.innerText = '🏺';

            if (mult > 1) {
                const multTag = document.createElement('div');
                multTag.className = 'jar-mult-tag';
                multTag.style.fontSize = '18px';
                multTag.innerText = mult + 'x';
                badge.appendChild(multTag);
            }

            fullJarNode.appendChild(badge);
            reelStrip.appendChild(fullJarNode);
        }

        function triggerScreenShake() {
            slotsFrame.classList.add('shake');
            setTimeout(() => slotsFrame.classList.remove('shake'), 500);
        }

        function showJarBanner(mult) {
            const banner = document.getElementById('jarBanner');
            document.getElementById('jarMultText').innerText = mult + 'x';
            banner.classList.add('show');
            setTimeout(() => banner.classList.remove('show'), 2200);
        }

        function hideJarBanner() {
            document.getElementById('jarBanner').classList.remove('show');
        }

        function applyShineToWinners(coords) {
            coords.forEach(([reelIdx, rowIdx]) => {
                let reelStrip = reelStrips[reelIdx];
                if (reelStrip && reelStrip.children[rowIdx]) {
                    reelStrip.children[rowIdx].classList.add('win-pop');
                }
            });
        }

        function clearShineEffects() {
            document.querySelectorAll('.symbol').forEach(s => s.classList.remove('win-pop'));
        }

        function showModal(title, desc) {
            playProSound('click');
            document.getElementById('modal-status').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('msg-modal').style.display = 'flex';
        }

        function closeModal() {
            playProSound('click');
            document.getElementById('msg-modal').style.display = 'none';
        }
    </script>
</body>
</html>
