<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Games WebApp</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .balance {
            font-size: 20px;
            color: #38bdf8;
            font-weight: bold;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        button {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
        input {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            text-align: center;
        }
        .game-box {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: #0f172a;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎰 كازينو الألعاب العالمي</h2>
        <div class="balance">رصيدك: <span id="userBalance">0.00</span> ليرة سورية</div>
    </div>

    <div class="card">
        <label>قيمة الرهان (ليرة جديدة):</label><br>
        <input type="number" id="betAmount" value="100" min="10">
    </div>

    <div class="grid">
        <button onclick="playGame('عجلة الحظ')">🎡 عجلة الحظ</button>
        <button onclick="playGame('حقل الألغام')">💣 حقل الألغام</button>
        <button onclick="playGame('ماكينة الحظ')">🎰 ماكينة الحظ</button>
        <button onclick="playGame('النرد')">🎲 النرد</button>
        <button onclick="playGame('الروليت')">🎯 الروليت</button>
        <button onclick="playGame('بلينكو')">⚪ بلينكو</button>
        <button onclick="playGame('كراش')">🚀 كراش</button>
        <button onclick="playGame('قلب الكروت')">🃏 قلب الكروت</button>
        <button onclick="playGame('كينو')">🔢 كينو</button>
        <button onclick="playGame('أكبر أو أصغر')">📈 أكبر أو أصغر</button>
    </div>

    <div id="gameResult" class="card game-box">
        <h3 id="resTitle"></h3>
        <p id="resDesc"></p>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let userId = tg.initDataUnsafe?.user?.id || 123456789; 

        async function fetchUser() {
            try {
                let res = await fetch('/api/get_user_data', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: userId })
                });
                let data = await res.json();
                if(data.balance !== undefined) {
                    document.getElementById('userBalance').innerText = data.balance.toFixed(2);
                }
            } catch(e) {}
        }

        async function playGame(gameName) {
            let bet = parseFloat(document.getElementById('betAmount').value);
            if(!bet || bet <= 0) {
                alert('يرجى تحديد مبلغ رهان صحيح');
                return;
            }

            let resBox = document.getElementById('gameResult');
            resBox.style.display = 'block';
            document.getElementById('resTitle').innerText = '⏳ جاري اللعب...';
            document.getElementById('resDesc').innerText = `جاري تشغيل لعبة ${gameName}`;

            try {
                let res = await fetch('/api/play_game', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user_id: userId,
                        bet: bet,
                        game_type: gameName
                    })
                });
                let data = await res.json();

                if(data.error) {
                    document.getElementById('resTitle').innerText = '❌ خطأ';
                    document.getElementById('resDesc').innerText = data.error;
                } else {
                    document.getElementById('userBalance').innerText = data.new_balance.toFixed(2);
                    if(data.win) {
                        document.getElementById('resTitle').innerText = '🎉 مبروك! فوز كبير';
                        document.getElementById('resDesc').innerText = `ربحت x${data.multiplier} بقيمة ${data.win_amount} ليرة سورية!`;
                    } else {
                        document.getElementById('resTitle').innerText = '💔 حظ أوفر';
                        document.getElementById('resDesc').innerText = `خسرت الرهان بقيمة ${bet} ليرة سورية.`;
                    }
                }
            } catch(e) {
                document.getElementById('resTitle').innerText = '❌ خطأ بالاتصال';
            }
        }

        fetchUser();
    </script>
</body>
</html>
